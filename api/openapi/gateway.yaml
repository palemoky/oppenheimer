openapi: 3.1.0
info:
  title: Oppenheimer Gateway API
  version: 1.0.0
  description: |
    Oppenheimer 订单系统的对外 HTTP 接口，由 gateway 服务提供。

    本文件是对外接口的唯一事实来源。改接口时先改这里，运行 `make openapi` 重新生成，再改 handler。

    通用约定：

    - 64 位 ID 在 JSON 里一律是十进制字符串。JavaScript 的数字是双精度浮点，超过 2^53 的整数会丢精度。
    - 金额是最小货币单位的整数，和币种一起出现，例如 `{"amount":1999,"currency":"CNY"}` 表示 19.99 元。
    - 时间是 RFC 3339 格式的 UTC 时间。
    - 请求体里出现未定义的字段会被拒绝（400）。
    - 所有错误响应的结构相同，见 `Error`。500 的响应不透出内部错误消息。
    - 网关按客户端地址、按用户加接口、按接口限流，超出时返回 429（`RATE_LIMITED`），见 `TooManyRequests`。
    - 存活探测 `GET /healthz` 由各服务统一提供，不属于本接口。
servers:
  - url: http://localhost:8080
    description: 本机（make run）
security:
  - userId: []
tags:
  - name: orders
    description: 订单
  - name: payments
    description: 支付
  - name: inventory
    description: 库存
  - name: merchants
    description: 商家视角的查询

paths:
  /api/v1/orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: 列出当前用户的订单
      description: |
        按创建时间从新到旧列出当前用户（`X-User-Id`）的订单，游标分页。

        订单按用户分片，一个用户的订单都在同一个分片里，所以这个列表只查用户自己的分片。

        一致性强于商家的订单列表：这里直接读订单库，不经过异步同步的索引，订单落库之后就能在列表里看到，
        状态与订单详情一致。但**已受理、还没落库的订单不在列表里**：下单返回 202 之后，订单要等队列消费、
        写入订单库才会出现，这段时间里用 `GET /api/v1/orders/{order_id}` 能查到 `creating`，列表里还没有它。

        每一行只有列表页要显示的字段，没有商品明细；完整内容用订单详情接口。
        同一毫秒内创建的订单先后顺序不严格。用户没有订单时返回空数组，不是错误。
      parameters:
        - name: status
          in: query
          required: false
          description: 只返回这个状态的订单；不传表示不筛选。
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          required: false
          description: 每页条数，1 到 100，默认 20。
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 不透明的分页游标，传上一页响应里的 `next_cursor`。不传表示从最新的开始。
          schema:
            type: string
      responses:
        '200':
          description: 一页订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

    post:
      operationId: createOrder
      tags: [orders]
      summary: 下单
      description: |
        下单是异步的：请求先经过库存闸门，放行后进入队列，立即返回 202 和状态为 `creating` 的订单
        （这时只有商品和数量，价格和总额在订单落库并预占库存之后才有）。
        客户端轮询 `GET /api/v1/orders/{order_id}`，直到状态离开 `creating`：
        `pending_payment` 表示下单成功，`failed` 表示失败。极少数情况下（受理后系统故障）订单会消失，
        查询返回 404，这时用同一个 `Idempotency-Key` 重新提交。

        库存不足、超出限购、商品不存在在提交时就能判断，直接返回错误，不会进入队列。

        幂等：同一用户用相同的 `Idempotency-Key` 重复提交，只产生一个订单，重复请求返回同一个订单（当前状态）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '202':
          description: 下单请求已受理（或幂等重放返回已有订单）
          headers:
            Location:
              description: 查询这个订单的地址
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            库存不足（`INSUFFICIENT_STOCK`）、超出每人限购数量（`PURCHASE_LIMIT_EXCEEDED`），
            或幂等键已被内容不同的请求使用（`IDEMPOTENCY_KEY_REUSED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/orders/{order_id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: 查询订单
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      summary: 取消订单
      description: 只有待支付的订单可以取消。对已取消的订单重复调用是幂等的。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 取消后的订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/orders/{order_id}/pay:
    post:
      operationId: payOrder
      tags: [payments]
      summary: 发起支付
      description: |
        支付单受理后返回 202，支付结果异步产生，客户端通过查询支付单或订单轮询结果。
        请求体可以省略。
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayOrderRequest'
      responses:
        '202':
          description: 支付单已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/orders/{order_id}/payment:
    get:
      operationId: getPayment
      tags: [payments]
      summary: 查询订单的支付单
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 支付单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/skus/{sku_id}/stock:
    get:
      operationId: getStock
      tags: [inventory]
      summary: 查询库存
      parameters:
        - $ref: '#/components/parameters/SkuId'
      responses:
        '200':
          description: 库存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

  /api/v1/merchants/{merchant_id}/orders:
    get:
      operationId: listMerchantOrders
      tags: [merchants]
      summary: 列出商家的订单
      description: |
        按创建时间从新到旧列出一个商家的订单，游标分页。
        `merchant_id` 直接信任，和其他接口对 `X-User-Id` 的处理一致（没有真实鉴权）。

        **最终一致**：这个列表来自订单库异步同步出来的一份索引（CDC），不是订单库本身。
        新订单可能晚一点才出现，状态也可能比订单详情里的旧。只用于展示；
        要看准确的状态，用 `GET /api/v1/orders/{order_id}`。

        只包含创建成功过的订单（库存预占成功、有商家的订单），创建失败的订单不在列表里。
        同一毫秒内创建的订单先后顺序不严格。商家没有订单时返回空数组，不是错误。
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: status
          in: query
          required: false
          description: 只返回这个状态的订单；不传表示不筛选。
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          required: false
          description: 每页条数，1 到 100，默认 20。
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: 不透明的分页游标，传上一页响应里的 `next_cursor`。不传表示从最新的开始。
          schema:
            type: string
      responses:
        '200':
          description: 一页订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantOrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    userId:
      type: apiKey
      in: header
      name: X-User-Id
      description: |
        当前用户的 ID（正整数）。1a 没有真实鉴权，这个请求头就代表已登录用户。
        缺少或非法时返回 401。

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键，由客户端生成，1 到 64 个字符。
      schema:
        type: string
        minLength: 1
        maxLength: 64
    OrderId:
      name: order_id
      in: path
      required: true
      description: 订单号（正整数的十进制字符串）
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    MerchantId:
      name: merchant_id
      in: path
      required: true
      description: 商家 ID（正整数的十进制字符串）
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
    SkuId:
      name: sku_id
      in: path
      required: true
      description: 商品 ID（正整数的十进制字符串）
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'

  headers:
    RetryAfter:
      description: |
        多少秒之后再重试（正整数，向上取整，至少 1）。它是下界：这段时间里别的请求也在消耗配额，
        到时重试仍可能被拒绝。原因码是 `RATE_LIMITED` 时一定有；`BACKLOGGED` 时不一定有。
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: 请求参数非法（`INVALID_ARGUMENT`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 缺少或非法的 `X-User-Id`（`UNAUTHENTICATED`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在，或不属于当前用户
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 当前状态不允许这个操作（`FAILED_PRECONDITION` 或更具体的原因码）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 请求体超过 1 MiB（`PAYLOAD_TOO_LARGE`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: |
        请求被拒绝，没有产生任何效果（没有调用下游，没有创建或修改任何东西）。原因码有两种，客户端的处理不同：

        - `RATE_LIMITED`：调用方自己太快了，超出了配额。按 `Retry-After` 等待之后再重试，不要立刻重试。
          `message` 里说明是哪一维的限制：`ip`（同一个客户端地址的所有请求）、`user`（同一个用户对这个接口）、
          `route`（这个接口所有用户的总量）。其他用户、其他接口通常不受影响。
        - `BACKLOGGED`：只在下单时出现。系统忙（等待落库的订单积压过多），与调用方的速率无关，所有人都应当退避；
          稍后用同一个 `Idempotency-Key` 重试即可。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: |
        其他错误。下游不可用为 503（`UNAVAILABLE`），下游超时为 504（`DEADLINE_EXCEEDED`），其余为 500。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Id:
      description: |
        64 位 ID 的十进制字符串。
        为兼容旧客户端，服务端在请求体里也接受 JSON 整数，但客户端应当始终发送字符串。
      type: string
      pattern: '^[1-9][0-9]*$'
      examples: ['9007199254741994']
      x-go-type: ID

    Money:
      description: 一笔金额。`amount` 的单位是该币种的最小货币单位（人民币为分）。
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          examples: [1999]
        currency:
          description: ISO 4217 货币代码
          type: string
          examples: [CNY]

    CreateOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'

    CreateOrderItem:
      type: object
      required: [sku_id, quantity]
      properties:
        sku_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          format: int32
          minimum: 1

    PayOrderRequest:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/SimulatedOutcome'

    SimulatedOutcome:
      description: 指定模拟支付的结果，仅用于测试。省略时由支付服务决定。
      type: string
      enum: [success, failure]

    OrderStatus:
      description: |
        订单状态。`creating` 是下单过程中的中间状态；`pending_payment` 待支付；`paid` 已支付；
        `cancelled` 用户取消；`closed` 超时未支付关单；`failed` 下单失败。
      type: string
      enum: [unspecified, creating, pending_payment, paid, cancelled, closed, failed]

    Order:
      type: object
      required: [order_id, user_id, status, total, items, create_time, expire_time]
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        create_time:
          type: string
          format: date-time
        expire_time:
          description: 支付截止时间，过期未支付的订单会被关闭
          type: string
          format: date-time
        pay_time:
          description: 支付成功的时间，未支付时不出现
          type: string
          format: date-time

    OrderSummaryList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        next_cursor:
          description: 下一页的游标；没有更多时不出现。对客户端是不透明的字符串。
          type: string

    OrderSummary:
      description: 用户订单列表里的一行，只有列表页要显示的字段。完整内容用订单详情接口。
      type: object
      required: [order_id, status, total, create_time, expire_time]
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          description: 订单总额。预占成功之前（`creating`）和创建失败（`failed`）的订单为 0。
          $ref: '#/components/schemas/Money'
        create_time:
          type: string
          format: date-time
        expire_time:
          description: 支付截止时间，过期未支付的订单会被关闭
          type: string
          format: date-time
        pay_time:
          description: 支付成功的时间，未支付时不出现
          type: string
          format: date-time

    MerchantOrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/MerchantOrder'
        next_cursor:
          description: 下一页的游标；没有更多时不出现。对客户端是不透明的字符串。
          type: string

    MerchantOrder:
      description: 列表里的一行，只有列表页要显示的字段。完整内容用订单详情接口。
      type: object
      required: [order_id, user_id, status, total, create_time]
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          $ref: '#/components/schemas/Money'
        create_time:
          type: string
          format: date-time
        pay_time:
          description: 支付成功的时间，未支付时不出现
          type: string
          format: date-time

    OrderItem:
      type: object
      required: [sku_id, quantity, unit_price]
      properties:
        sku_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: integer
          format: int32
        unit_price:
          $ref: '#/components/schemas/Money'

    PaymentStatus:
      description: 支付单状态。`refunded` 表示支付成功后因订单已关闭或金额不符而退款。
      type: string
      enum: [unspecified, pending, succeeded, failed, refunded]

    Payment:
      type: object
      required: [payment_id, order_id, user_id, status, amount, create_time, notified]
      properties:
        payment_id:
          $ref: '#/components/schemas/Id'
        order_id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        create_time:
          type: string
          format: date-time
        notified:
          description: 支付结果是否已经通知到订单服务
          type: boolean

    Stock:
      description: 三个数量之和在下单、支付、取消的过程中保持不变。
      type: object
      required: [sku_id, available, reserved, sold, unit_price]
      properties:
        sku_id:
          $ref: '#/components/schemas/Id'
        available:
          description: 可售数量
          type: integer
          format: int64
        reserved:
          description: 已被订单预占、尚未支付的数量
          type: integer
          format: int64
        sold:
          description: 已售出的数量
          type: integer
          format: int64
        unit_price:
          $ref: '#/components/schemas/Money'

    Error:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          description: |
            机器可读的错误码。优先是业务原因码（如 `INSUFFICIENT_STOCK`、`ORDER_NOT_FOUND`），
            没有原因码时是 gRPC 状态码的名字（如 `INVALID_ARGUMENT`、`UNAVAILABLE`）。
          type: string
          examples: [INSUFFICIENT_STOCK]
        message:
          description: 给人看的说明，不要依赖它的内容做判断
          type: string
