syntax = "proto3";

package oppenheimer.order.v1;

import "google/protobuf/timestamp.proto";
import "oppenheimer/common/v1/money.proto";

// OrderService 管理订单的创建、查询、取消，以及支付结果的处理。
service OrderService {
  // SubmitOrder 受理下单请求：在库存闸门（Redis）里扣减并记下占用，把请求写入 Kafka 后立即返回。
  // 订单随后由订单服务异步落库并预占库存，调用方用 GetOrder 轮询，直到状态离开 CREATING。
  //
  // 返回的订单状态是 CREATING，只有商品和数量，价格在预占成功后才有。
  //
  // 以 (user_id, idempotency_key) 幂等：重复请求返回第一次受理的订单（当前状态）。
  //
  // 错误：
  //   INVALID_ARGUMENT     reason=INVALID_ARGUMENT        参数不合法
  //   NOT_FOUND            reason=SKU_NOT_FOUND
  //   FAILED_PRECONDITION  reason=INSUFFICIENT_STOCK
  //   FAILED_PRECONDITION  reason=PURCHASE_LIMIT_EXCEEDED 超出该 SKU 的每人限购数量
  //   ALREADY_EXISTS       reason=IDEMPOTENCY_KEY_REUSED  同一幂等键对应的请求内容不同
  //   UNAVAILABLE                                          Redis 或 Kafka 暂不可用，本次没有受理；用同一幂等键重试
  rpc SubmitOrder(SubmitOrderRequest) returns (SubmitOrderResponse);

  // GetOrder 查询订单。订单不属于该用户时等同于不存在。
  //
  // 错误：
  //   NOT_FOUND  reason=ORDER_NOT_FOUND
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);

  // CancelOrder 取消待支付的订单。对已取消的订单重复调用返回成功。
  //
  // 错误：
  //   NOT_FOUND            reason=ORDER_NOT_FOUND
  //   FAILED_PRECONDITION  reason=ORDER_NOT_CANCELLABLE 订单不在待支付状态
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  // 订单已落库，库存尚未预占完成。对用户不可见的中间状态。
  ORDER_STATUS_CREATING = 1;
  // 库存已预占，等待支付。
  ORDER_STATUS_PENDING_PAYMENT = 2;
  // 已支付。终态。
  ORDER_STATUS_PAID = 3;
  // 用户取消。终态。
  ORDER_STATUS_CANCELLED = 4;
  // 超时未支付被系统关闭。终态。
  ORDER_STATUS_CLOSED = 5;
  // 创建失败（如库存不足）。终态。
  ORDER_STATUS_FAILED = 6;
}

message OrderItem {
  int64 sku_id = 1;
  int32 quantity = 2;
  oppenheimer.common.v1.Money unit_price = 3;
}

message Order {
  int64 order_id = 1;
  int64 user_id = 2;
  OrderStatus status = 3;
  oppenheimer.common.v1.Money total = 4;
  repeated OrderItem items = 5;
  google.protobuf.Timestamp create_time = 6;
  // 支付截止时间，过期未支付会被关闭。
  google.protobuf.Timestamp expire_time = 7;
  // 仅已支付的订单有值。
  google.protobuf.Timestamp pay_time = 8;
}

message SubmitOrderItem {
  int64 sku_id = 1;
  // 数量，必须大于 0。
  int32 quantity = 2;
}

message SubmitOrderRequest {
  int64 user_id = 1;
  // 客户端生成的幂等键，1 到 64 个字符。
  string idempotency_key = 2;
  // 同一请求内 sku_id 不能重复，至少一项。
  repeated SubmitOrderItem items = 3;
}

message SubmitOrderResponse {
  Order order = 1;
}

message GetOrderRequest {
  int64 order_id = 1;
  int64 user_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  int64 order_id = 1;
  int64 user_id = 2;
}

message CancelOrderResponse {
  Order order = 1;
}
