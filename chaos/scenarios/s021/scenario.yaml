# 字段的含义见 chaos/README.md。主人在实验之前不读这个目录（设计第 2 节第 3 项）。
id: s021
method: chaos-mesh
risk: 1
blind: yes
category: network
target:
  workload: order
duration: 10m
requires:
  - 稳态的压测在跑（下单、查订单都要有）
  - 第一次做时恢复加 WAIT_RECON=1（订单库 0 有 10 分钟落不了库、全部受理被拒绝再恢复，是对落库重试、回收和补偿的考验）
recover:
  restart: []
  notes:
    - 没有恢复动作：duration 到了 Chaos Mesh 自己撤掉，挂住的连接恢复或者重建，落库的熔断器过一次试探后合上
    - 恢复后这个库上积压的落库、支付结果、outbox 自己追上；延迟关单的消息重试 10 次后进了死信的由兜底扫描处理
    - 目标命名空间里会留下 PodNetworkChaos 对象（chaos/README.md 的“盲测时的痕迹”）
expected_alerts: [OrderLandingBreakerOpen, SLOOrderCreateAvailabilityBurnFast, IngressGateway5xxHigh, SLOOrderPayAvailabilityBurnFast, ConsumerDeadLettered]
