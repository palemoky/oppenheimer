# 对象建在 chaos-mesh，选择器指向目标命名空间；__TARGET_NS__ 和 __RUN_ID__ 由 chaos-run.sh 填。
# order 的一个副本（mode: one，随机挑）发往它的两个调用方（gateway、payment 的 Pod）的包慢 4 秒，超过路由上最长的 3 秒时限。
# 只对着调用方的地址：kubelet 的探针（来自节点地址）、去 MySQL、Redis、Kafka 的流量都不受影响，
# 所以这个副本一直 Ready、自己量到的处理耗时是正常的，只是调用方等不到响应。
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: c-__RUN_ID__
  namespace: chaos-mesh
  labels:
    oppenheimer.chaos/run: __RUN_ID__
spec:
  action: delay
  mode: one
  selector:
    namespaces: [__TARGET_NS__]
    labelSelectors:
      app.kubernetes.io/name: order
  direction: to
  target:
    mode: all
    selector:
      namespaces: [__TARGET_NS__]
      expressionSelectors:
        - key: app.kubernetes.io/name
          operator: In
          values: [gateway, payment]
  delay:
    latency: 4s
  duration: 10m
