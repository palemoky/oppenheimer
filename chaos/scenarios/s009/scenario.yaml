# 字段的含义见 chaos/README.md。主人在实验之前不读这个目录（设计第 2 节第 3 项）。
id: s009
method: fault-switch
risk: 2
category: app
target:
  workload: gateway
duration: 3h
requires:
  - 镜像是带故障代码的构建（GO_TAGS=faults，tag 的后缀是 -p4）
  - 稳态的压测在跑，并且里面有支付（k6 mixed 的 payOrder）：没有到终态又被读到的订单，这个场景没有表现
  - 能看 gateway 的 Go 运行时内存指标和 heap 剖析（症状涨得慢，只看容器内存要几个小时才分得出来）
recover:
  restart: [gateway]
  notes:
    - 关掉开关（到 ttl 也会自己关），脚本做
    - 已经占住的内存关了开关不会释放，滚动重启目标工作负载（脚本做）
expected_alerts: []
