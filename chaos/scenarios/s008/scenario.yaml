# 字段的含义见 chaos/README.md。主人在实验之前不读这个目录（设计第 2 节第 3 项）。
id: s008
method: chaos-mesh
risk: 1
blind: no
category: dns
target:
  workload: orderindex
duration: 35m
requires:
  - 稳态的压测在跑（商家订单列表的读和商家索引的写都要有）
recover:
  restart: []
  notes:
