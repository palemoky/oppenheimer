# 字段的含义见 chaos/README.md。主人在实验之前不读这个目录（设计第 2 节第 3 项）。
id: s024
method: script
risk: 1
category: mysql
target:
  workload: order
duration: 15m
requires:
  - 稳态的压测在跑
  - 订单库 0 的四张订单表里要有足够多的行（几十万行以上），不然语句一下就跑完、没有症状；注入前数一下
recover:
  restart: []
  notes:
    - 脚本让循环停下并 KILL 掉正在跑的那几条语句；到 duration 循环自己结束
    - 只读，没有要清的数据；缓冲池被扫描冲掉的热页要几分钟才回来
expected_alerts: []
