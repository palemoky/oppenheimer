# 字段的含义见 chaos/README.md。主人在实验之前不读这个目录（设计第 2 节第 3 项）。
id: s022
method: script
risk: 1
category: mysql
target:
  workload: inventory
duration: 10m
requires:
  - 稳态的压测在跑（要有下单，stock_pending 才有增量要应用）
  - 第一次做时恢复加 WAIT_RECON=1（库存的增量积压 10 分钟再一次应用，库存的常驻核对要看）
recover:
  restart: []
  notes:
    - 脚本在 mysql-main 的主库上 KILL 掉那个会话（事务回滚、锁放掉）；到 duration 它自己也会结束
    - 积压的库存增量由 inventory 的应用任务自己追上，不用人工处理
    - mysql-main 的 Pod 重启的话那个会话跟着没了，故障提前结束
expected_alerts: []
