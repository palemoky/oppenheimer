# 对象建在 chaos-mesh，选择器指向目标命名空间；__TARGET_NS__ 和 __RUN_ID__ 由 chaos-run.sh 填。
# inventory 的 Pod 发往缓存 Redis（redis-cache，Redis Cluster，命名空间 redis）的包慢 5 毫秒。
# 目标写 Pod 的地址：redis-cache 的 Service 是 headless 的，客户端直接连各节点（NOTES.md 里 s008 那一条）。
# 延迟只加在出方向，一次往返多 5 毫秒，不是 10。没有抖动：要的是“锁里一次变长”，不是乱序。
# 先按 5 毫秒试；不够再到 8。不要到 10 以上（s010 的 truth.md“触发条件”：上限低于到达速率，队列只涨不降）。
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: c-__RUN_ID__
  namespace: chaos-mesh
  labels:
    oppenheimer.chaos/run: __RUN_ID__
spec:
  action: delay
  mode: all
  selector:
    namespaces: [__TARGET_NS__]
    labelSelectors:
      app.kubernetes.io/name: inventory
  direction: to
  externalTargets: [__POD_IPS:redis:app.kubernetes.io/instance=redis-cache__]
  delay:
    latency: 5ms
  duration: 20m
