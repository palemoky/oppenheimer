# 字段的含义见 chaos/README.md。主人在实验之前不读这个目录（设计第 2 节第 3 项）。
id: s006
method: chaos-mesh
risk: 1
category: stress
target:
  workload: gateway
duration: 5m
requires:
  - 目标工作负载至少 2 个副本
  - 稳态的压测在跑
