# envoy-gateway：gateway 服务的 Envoy 边车（设计文档 1d 第 5 节、ADR-0020）。Envoy v1.40.2。
#
# 没有入站：客户端直接访问 gateway 的 HTTP 端口，gateway 自己就是入口。
# 出站：gateway 调用下游时连这里的端口（15081 到 order、15082 到 inventory、15083 到 payment、15084 到 orderindex），每个下游一个集群，
# 并发上限、摘除、路由超时都在这一侧，各有各的额度和统计。
#
# 五个边车的配置结构相同，数值见设计文档 5.5 的表。改这里的数时同步改那张表；
# 出站路由的 timeout 还要和 Go 代码里同一跳的时限一致（有测试核对）。用 make envoy-validate 校验。
#
# 三处不能照默认值的地方（实测的结论，见设计文档 5.3）：
#   - max_ejection_percent: 100 和 healthy_panic_threshold: 0。每个下游只有一个实例时，
#     默认值（最多摘 10%、健康实例低于一半就无视摘除）会让摘除完全不生效。
#   - 出站路由必须写固定的 timeout。慢下游只有靠它到期才计入异常检测；
#     调用方自己断开、按 grpc-timeout 头算的超时都不计。
#   - 不开 split_external_local_origin_errors。开了之后路由超时不触发摘除。
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---- 出站 ----
    - name: to_order
      address:
        socket_address: { address: 0.0.0.0, port_value: 15081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: to_order
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: to_order
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: to_order
                            # 这一跳的预算，也是慢下游能被摘除的唯一途径。和 Go 代码里 gateway 调 order 的时限一致。
                            timeout: 3s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: to_inventory
      address:
        socket_address: { address: 0.0.0.0, port_value: 15082 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: to_inventory
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: to_inventory
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: to_inventory
                            # 这一跳的预算，也是慢下游能被摘除的唯一途径。和 Go 代码里 gateway 调 inventory 的时限一致。
                            timeout: 3s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: to_payment
      address:
        socket_address: { address: 0.0.0.0, port_value: 15083 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: to_payment
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: to_payment
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: to_payment
                            # 这一跳的预算，也是慢下游能被摘除的唯一途径。和 Go 代码里 gateway 调 payment 的时限一致。
                            timeout: 3s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: to_orderindex
      address:
        socket_address: { address: 0.0.0.0, port_value: 15084 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: to_orderindex
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: to_orderindex
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: to_orderindex
                            # 这一跳的预算，也是慢下游能被摘除的唯一途径。和 Go 代码里 gateway 调 orderindex 的时限一致。
                            timeout: 3s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: to_order
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            # 并发隔离：这个调用方对这个下游同时在途的请求数上限。超过的立刻返回 UNAVAILABLE（overflow）。
            max_requests: 512
            max_pending_requests: 512
            max_connections: 16
            # 同步调用链上不重试，由客户端带幂等键重试。
            max_retries: 0
            track_remaining: true
      # 熔断：连续 5 次失败（下游报 5xx 类的错误、连不上、路由超时）就摘除 5 秒，期间立刻返回 UNAVAILABLE。
      outlier_detection:
        consecutive_5xx: 5
        consecutive_gateway_failure: 5
        enforcing_consecutive_5xx: 100
        enforcing_consecutive_gateway_failure: 100
        interval: 1s
        base_ejection_time: 5s
        # 默认会随被摘除的次数逐次加长到 300 秒。固定成 5 秒：服务被反复重启时恢复时间不要越来越长。
        max_ejection_time: 5s
        max_ejection_percent: 100
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      load_assignment:
        cluster_name: to_order
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: envoy-order, port_value: 15001 }
    - name: to_inventory
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            # 并发隔离：这个调用方对这个下游同时在途的请求数上限。超过的立刻返回 UNAVAILABLE（overflow）。
            max_requests: 128
            max_pending_requests: 128
            max_connections: 16
            # 同步调用链上不重试，由客户端带幂等键重试。
            max_retries: 0
            track_remaining: true
      # 熔断：连续 5 次失败（下游报 5xx 类的错误、连不上、路由超时）就摘除 5 秒，期间立刻返回 UNAVAILABLE。
      outlier_detection:
        consecutive_5xx: 5
        consecutive_gateway_failure: 5
        enforcing_consecutive_5xx: 100
        enforcing_consecutive_gateway_failure: 100
        interval: 1s
