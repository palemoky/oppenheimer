# envoy-order：order 服务的 Envoy 边车（设计文档 1d 第 5 节、ADR-0020）。Envoy v1.40.2。
#
# 入站：别的服务的边车把请求发到这里的 15001，转给本机 order 进程的 gRPC 端口（9081）。
# 出站：order 调用下游时连这里的端口（15182 到 inventory），每个下游一个集群，
# 并发上限、摘除、路由超时都在这一侧，各有各的额度和统计。
#
# 五个边车的配置结构相同，数值见设计文档 5.5 的表。改这里的数时同步改那张表；
# 出站路由的 timeout 还要和 Go 代码里同一跳的时限一致（有测试核对）。用 make envoy-validate 校验。
#
# 三处不能照默认值的地方（实测的结论，见设计文档 5.3）：
#   - max_ejection_percent: 100 和 healthy_panic_threshold: 0。每个下游只有一个实例时，
#     默认值（最多摘 10%、健康实例低于一半就无视摘除）会让摘除完全不生效。
#   - 出站路由必须写固定的 timeout。慢下游只有靠它到期才计入异常检测；
#     调用方自己断开、按 grpc-timeout 头算的超时都不计。
#   - 不开 split_external_local_origin_errors。开了之后路由超时不触发摘除。
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ---- 入站 ----
    - name: inbound
      address:
        socket_address: { address: 0.0.0.0, port_value: 15001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inbound
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: inbound
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: local_app
                            # 入站不设时限：这一跳的时限由调用方那一侧的出站路由决定。0s 表示关闭（不写的话默认是 15 秒）。
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    # ---- 出站 ----
    - name: to_inventory
      address:
        socket_address: { address: 0.0.0.0, port_value: 15182 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: to_inventory
                codec_type: AUTO
                route_config:
                  virtual_hosts:
                    - name: to_inventory
                      domains: ["*"]
                      routes:
                        # Reserve 单独一条路由，时限 3 秒（ADR-0020 的 2026-11-21 补充）：它只在落库的消费者里调用，
                        # 没有用户在等，时限按“区分慢和坏”定。1 秒时一次盘的停顿会让几十个在途的 Reserve 同时超时，
                        # 把 inventory 整个摘除 5 秒。和 Go 代码里的 reserveHopBudget 一致。从上到下第一条匹配的生效，
                        # 所以它必须在兜底路由之前。
                        - match: { path: "/oppenheimer.inventory.v1.InventoryService/Reserve" }
                          route:
                            cluster: to_inventory
                            timeout: 3s
                        - match: { prefix: "/" }
                          route:
                            cluster: to_inventory
                            # 这一跳的预算，也是慢下游能被摘除的唯一途径。和 Go 代码里的 inventoryHopBudget 一致。
                            timeout: 1s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # 入站：转给本机的服务进程。到了 K8s，边车和服务在同一个 Pod 里，这个地址换成 127.0.0.1。
    - name: local_app
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            # 这个服务总共同时处理多少请求，不管来自谁。比任何一个调用方的出站额度都大，
            # 正常情况下先触发的是调用方那一侧的上限。
            max_requests: 1024
            max_pending_requests: 1024
            max_connections: 64
            max_retries: 0
            track_remaining: true
      load_assignment:
        cluster_name: local_app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 9081 }
    - name: to_inventory
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            # 并发隔离：这个调用方对这个下游同时在途的请求数上限。超过的立刻返回 UNAVAILABLE（overflow）。
            max_requests: 128
            max_pending_requests: 128
            max_connections: 16
            # 同步调用链上不重试，由客户端带幂等键重试。
            max_retries: 0
            track_remaining: true
      # 熔断：连续 5 次失败（下游报 5xx 类的错误、连不上、路由超时）就摘除 5 秒，期间立刻返回 UNAVAILABLE。
      outlier_detection:
        consecutive_5xx: 5
        consecutive_gateway_failure: 5
        enforcing_consecutive_5xx: 100
        enforcing_consecutive_gateway_failure: 100
        interval: 1s
        base_ejection_time: 5s
        # 默认会随被摘除的次数逐次加长到 300 秒。固定成 5 秒：服务被反复重启时恢复时间不要越来越长。
        max_ejection_time: 5s
        max_ejection_percent: 100
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      load_assignment:
        cluster_name: to_inventory
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: envoy-inventory, port_value: 15001 }
