# 本地开发依赖：单实例的 MySQL、Redis（另有一个缓存专用实例）、Kafka。
# 版本登记在 docs/infra/versions.md。端口只绑定到 127.0.0.1。
name: oppenheimer

# order 的四个 MySQL 实例共用的部分（镜像、root 密码、healthcheck）。每个实例的 server-id 不同，
# command 是列表无法合并，所以各自完整列出。
x-mysql-shard: &mysql-shard
  image: mysql:9.7.4
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oppenheimer}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  mysql:
    image: mysql:9.7.4
    command:
      - --server-id=1
      # GTID 和 ROW 格式的 binlog 是主从复制（1c）和 CDC（1c）的前提，从一开始就打开。
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oppenheimer}
      MYSQL_DATABASE: oppenheimer
    ports:
      - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ---- order 服务的两个分片，每个分片一主一从（1c）----
  # 分片 i 的主库承载 order_db_i，从库通过 GTID 自动定位复制主库。复制关系由
  # scripts/mysql-replication.sh 在 make up 里建立（幂等），compose 只负责把实例起来。
  # 现有的 mysql 继续承载 inventory_db、payment_db，以及 chaos/bench 带前缀的库。
  #
  # 内存调优（参数名均用 `mysqld --verbose --help` 在 mysql:9.7.4 上确认存在）：
  # 5 个 MySQL 同时跑，默认配置每个约 400 MB 以上，笔记本放不下；本地练习的数据量很小，
  # 所以把各类缓冲压到够用的最小值，目标空闲时每个实例 300 MB 以内。
  #   performance_schema=OFF       最大的一块固定开销（几十到上百 MB），本地不需要看它的表
  #   innodb_buffer_pool_size=64M  默认 128M；数据集很小，压测的热数据也放得下
  #   innodb_log_buffer_size=8M    默认 64M；事务都很短，不需要大的 redo 缓冲
  #   innodb_adaptive_hash_index=OFF  省掉哈希索引占用，点查负载收益有限
  #   innodb_buffer_pool_instances=1  64M 的池没必要分多个实例
  #   max_connections=100          压测时每个服务在每个分片上的连接池加起来不超过它；再低就有风险
  #   table_open_cache=400、table_definition_cache=400、table_open_cache_instances=2
  #                                默认 4000/2000/16；这里只有十几张表（order 分表数 * 库）
  #   thread_cache_size=8、host_cache_size=0   缩小线程缓存；本地不需要主机名缓存
  #   key_buffer_size=1M、tmp_table_size=16M、max_heap_table_size=16M  MyISAM 键缓存基本用不到，临时表有上限
  #   mysqlx=OFF                   关掉 X Plugin（33060 端口），用不到
  #   replica_parallel_workers=2   从库回放线程默认 4 个，压到 2 个省线程栈内存；
  #                                本地压力下 2 个足够，也减少复制延迟的干扰因素
  mysql-order-0:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=11
    ports:
      - 127.0.0.1:${MYSQL_ORDER_0_PORT:-3311}:3306
    volumes:
      - mysql-order-0-data:/var/lib/mysql

  # 从库的 read_only / super_read_only 不写在 command 里：官方镜像首次启动时要在临时实例上
  # 写 root 密码和系统表，super_read_only 会让初始化失败。改由 mysql-replication.sh 在复制建立之后
  # 用 SET PERSIST 打开，持久化在 mysqld-auto.cnf，容器重启后依然生效。
  mysql-order-0-replica:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=12
    ports:
      - 127.0.0.1:${MYSQL_ORDER_0_REPLICA_PORT:-3312}:3306
    volumes:
      - mysql-order-0-replica-data:/var/lib/mysql

  mysql-order-1:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=21
    ports:
      - 127.0.0.1:${MYSQL_ORDER_1_PORT:-3321}:3306
    volumes:
      - mysql-order-1-data:/var/lib/mysql

  # 从库的 read_only / super_read_only 不写在 command 里：官方镜像首次启动时要在临时实例上
  # 写 root 密码和系统表，super_read_only 会让初始化失败。改由 mysql-replication.sh 在复制建立之后
  # 用 SET PERSIST 打开，持久化在 mysqld-auto.cnf，容器重启后依然生效。
  mysql-order-1-replica:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=22
    ports:
      - 127.0.0.1:${MYSQL_ORDER_1_REPLICA_PORT:-3322}:3306
    volumes:
      - mysql-order-1-replica-data:/var/lib/mysql

  redis:
    image: redis:8.10.3
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # 库存等数据不能被淘汰，内存满时宁可写入报错。
      - --maxmemory-policy
      - noeviction
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 查询缓存专用的实例，配置与上面的 redis 正相反：内存满了淘汰旧 key，不持久化。
  # 两者不能合并：缓存涨满内存会让 noeviction 的实例拒绝写入，库存闸门跟着不可用
  # （设计文档 1b 的 7.2.5）。锁和闸门留在 redis，这里只放丢了可以重建的数据。
  redis-cache:
    image: redis:8.10.3
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - 127.0.0.1:${CACHE_REDIS_PORT:-6380}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    environment:
      # KRaft 单节点：同一进程兼任 broker 和 controller。
      CLUSTER_ID: b3BwZW5oZWltZXIta2Fma2E
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL 给 compose 网络内的容器用，EXTERNAL 给宿主机上运行的服务用。
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 单节点下内部 topic 的副本数只能是 1。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topic 必须显式创建，避免拼写错误悄悄生成新 topic。
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - 127.0.0.1:${KAFKA_PORT:-9092}:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

volumes:
  mysql-data:
  mysql-order-0-data:
  mysql-order-0-replica-data:
  mysql-order-1-data:
  mysql-order-1-replica-data:
  redis-data:
  kafka-data:
