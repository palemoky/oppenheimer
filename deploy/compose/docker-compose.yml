# 本地开发依赖：单实例的 MySQL、Redis（另有一个缓存专用实例）、Kafka。
# 版本登记在 docs/infra/versions.md。端口只绑定到 127.0.0.1。
name: oppenheimer

# order 的四个 MySQL 实例共用的部分（镜像、root 密码、healthcheck）。每个实例的 server-id 不同，
# command 是列表无法合并，所以各自完整列出。
x-mysql-shard: &mysql-shard
  image: mysql:9.7.4
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oppenheimer}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 20s

services:
  mysql:
    image: mysql:9.7.4
    command:
      - --server-id=1
      # GTID 和 ROW 格式的 binlog 是主从复制（1c）和 CDC（1c）的前提，从一开始就打开。
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      # 让每个 TABLE_MAP 事件带上列名。行事件里只有按位置排列的值，CDC 靠它得到“产生这条日志时”的列名，
      # 不用去库里查当前的表结构（设计文档 1c 的 4.8）。从库的 binlog 由从库自己写，所以每个实例都要设。
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      # 默认的 151 不够用。这个实例上的连接池加起来已经是 164：inventory 50、payment 50、
      # 商家索引 2 个库各 25、订单冷库 10、归档任务 4；集成测试的临时库也都建在它上面，
      # 服务开着的时候跑测试会报 1040（Too many connections）。每个连接的固定开销很小，
      # 给到 400 留出测试并行跑的余量。真正的约束仍然是各服务自己的连接池上限。
      - --max-connections=400
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oppenheimer}
      MYSQL_DATABASE: oppenheimer
    ports:
      - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # ---- order 服务的两个分片，每个分片一主一从（1c）----
  # 分片 i 的主库承载 order_db_i，从库通过 GTID 自动定位复制主库。复制关系由
  # scripts/mysql-replication.sh 在 make up 里建立（幂等），compose 只负责把实例起来。
  # 现有的 mysql 继续承载 inventory_db、payment_db，以及 chaos/bench 带前缀的库。
  #
  # 内存调优（参数名均用 `mysqld --verbose --help` 在 mysql:9.7.4 上确认存在）：
  # 5 个 MySQL 同时跑，默认配置每个约 400 MB 以上，笔记本放不下；本地练习的数据量很小，
  # 所以把各类缓冲压到够用的最小值，目标空闲时每个实例 300 MB 以内。
  #   performance_schema=OFF       最大的一块固定开销（几十到上百 MB），本地不需要看它的表
  #   innodb_buffer_pool_size=64M  默认 128M；数据集很小，压测的热数据也放得下
  #   innodb_log_buffer_size=8M    默认 64M；事务都很短，不需要大的 redo 缓冲
  #   innodb_adaptive_hash_index=OFF  省掉哈希索引占用，点查负载收益有限
  #   innodb_buffer_pool_instances=1  64M 的池没必要分多个实例
  #   max_connections=100          压测时每个服务在每个分片上的连接池加起来不超过它；再低就有风险
  #   table_open_cache=400、table_definition_cache=400、table_open_cache_instances=2
  #                                默认 4000/2000/16；这里只有十几张表（order 分表数 * 库）
  #   thread_cache_size=8、host_cache_size=0   缩小线程缓存；本地不需要主机名缓存
  #   key_buffer_size=1M、tmp_table_size=16M、max_heap_table_size=16M  MyISAM 键缓存基本用不到，临时表有上限
  #   mysqlx=OFF                   关掉 X Plugin（33060 端口），用不到
  #   replica_parallel_workers=2   从库回放线程默认 4 个，压到 2 个省线程栈内存；
  #                                本地压力下 2 个足够，也减少复制延迟的干扰因素
  mysql-order-0:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=11
    ports:
      - 127.0.0.1:${MYSQL_ORDER_0_PORT:-3311}:3306
    volumes:
      - mysql-order-0-data:/var/lib/mysql

  # 从库的 read_only / super_read_only 不写在 command 里：官方镜像首次启动时要在临时实例上
  # 写 root 密码和系统表，super_read_only 会让初始化失败。改由 mysql-replication.sh 在复制建立之后
  # 用 SET PERSIST 打开，持久化在 mysqld-auto.cnf，容器重启后依然生效。
  mysql-order-0-replica:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      # 中继日志的文件名默认取主机名，而容器每次重建主机名都会变：复制元数据里记的旧文件名找不到，
      # 复制线程起不来（错误 1872）。固定成与主机名无关的名字。
      - --relay-log=relay-bin
      - --server-id=12
    ports:
      - 127.0.0.1:${MYSQL_ORDER_0_REPLICA_PORT:-3312}:3306
    volumes:
      - mysql-order-0-replica-data:/var/lib/mysql

  mysql-order-1:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=21
    ports:
      - 127.0.0.1:${MYSQL_ORDER_1_PORT:-3321}:3306
    volumes:
      - mysql-order-1-data:/var/lib/mysql

  # 从库的 read_only / super_read_only 不写在 command 里：官方镜像首次启动时要在临时实例上
  # 写 root 密码和系统表，super_read_only 会让初始化失败。改由 mysql-replication.sh 在复制建立之后
  # 用 SET PERSIST 打开，持久化在 mysqld-auto.cnf，容器重启后依然生效。
  mysql-order-1-replica:
    <<: *mysql-shard
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --relay-log=relay-bin
      - --server-id=22
    ports:
      - 127.0.0.1:${MYSQL_ORDER_1_REPLICA_PORT:-3322}:3306
    volumes:
      - mysql-order-1-replica-data:/var/lib/mysql
  # ---- 扩容演练（1c 步骤四，设计文档 5.7）：order 从 2 个库扩到 4 个库时新增的两个分片 ----
  # 属于 profile `expand`，平时 make up 不会启动；由 make expand-up 启动，scripts/expand.sh 负责复制和提升。
  # 配置与上面的 order 实例一致。差别只有 restart: CLONE 完成后 mysqld 会退出重启，官方镜像里
  # mysqld 没有守护进程，靠容器的重启策略把它拉起来。
  mysql-order-2:
    <<: *mysql-shard
    profiles: ["expand"]
    restart: unless-stopped
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=31
    ports:
      - 127.0.0.1:${MYSQL_ORDER_2_PORT:-3331}:3306
    volumes:
      - mysql-order-2-data:/var/lib/mysql

  mysql-order-2-replica:
    <<: *mysql-shard
    profiles: ["expand"]
    restart: unless-stopped
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --relay-log=relay-bin
      - --server-id=32
    ports:
      - 127.0.0.1:${MYSQL_ORDER_2_REPLICA_PORT:-3332}:3306
    volumes:
      - mysql-order-2-replica-data:/var/lib/mysql

  mysql-order-3:
    <<: *mysql-shard
    profiles: ["expand"]
    restart: unless-stopped
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --server-id=41
    ports:
      - 127.0.0.1:${MYSQL_ORDER_3_PORT:-3341}:3306
    volumes:
      - mysql-order-3-data:/var/lib/mysql

  mysql-order-3-replica:
    <<: *mysql-shard
    profiles: ["expand"]
    restart: unless-stopped
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-row-image=FULL
      - --binlog-row-metadata=FULL
      - --character-set-server=utf8mb4
      - --default-time-zone=+00:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --innodb-adaptive-hash-index=OFF
      - --max-connections=100
      - --table-open-cache=400
      - --table-definition-cache=400
      - --table-open-cache-instances=2
      - --thread-cache-size=8
      - --host-cache-size=0
      - --key-buffer-size=1M
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
      - --mysqlx=OFF
      - --replica-parallel-workers=2
      - --relay-log=relay-bin
      - --server-id=42
    ports:
      - 127.0.0.1:${MYSQL_ORDER_3_REPLICA_PORT:-3342}:3306
    volumes:
      - mysql-order-3-replica-data:/var/lib/mysql

  redis:
    image: redis:8.10.3
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # 库存等数据不能被淘汰，内存满时宁可写入报错。
      - --maxmemory-policy
      - noeviction
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 查询缓存专用的实例，配置与上面的 redis 正相反：内存满了淘汰旧 key，不持久化。
  # 两者不能合并：缓存涨满内存会让 noeviction 的实例拒绝写入，库存闸门跟着不可用
  # （设计文档 1b 的 7.2.5）。锁和闸门留在 redis，这里只放丢了可以重建的数据。
  redis-cache:
    image: redis:8.10.3
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - 127.0.0.1:${CACHE_REDIS_PORT:-6380}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    environment:
      # KRaft 单节点：同一进程兼任 broker 和 controller。
      CLUSTER_ID: b3BwZW5oZWltZXIta2Fma2E
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL 给 compose 网络内的容器用，EXTERNAL 给宿主机上运行的服务用。
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 单节点下内部 topic 的副本数只能是 1。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topic 必须显式创建，避免拼写错误悄悄生成新 topic。
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - 127.0.0.1:${KAFKA_PORT:-9092}:9092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # ---- Kafka 的 Web 界面（kafbat-ui），只用来看 topic、消息、消费组的 lag ----
  # 属于 profile `ui`，平时 make up 和 CI 不启动；make kafka-ui 启动，make kafka-ui-down 删除。
  # 连 kafka 的 INTERNAL 监听器（kafka:19092）：EXTERNAL 只对 localhost 广播，容器里连不上。
  # 只读模式：界面上不能删 topic、改位点、发消息。消息体是 protobuf，未配置 serde，只能看原始字节。
  # 不设登录，端口只绑定 127.0.0.1。
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: ["ui"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_READONLY: "true"
      # 不让界面把配置写到容器里的动态配置文件。
      DYNAMIC_CONFIG_ENABLED: "false"
      # JVM 堆上限 256 MB，容器上限 512 MB（堆外、元空间和线程栈另算）。
      JAVA_OPTS: -Xms128m -Xmx256m
    mem_limit: 512m
    ports:
      - 127.0.0.1:${KAFKA_UI_PORT:-8090}:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  mysql-data:
  mysql-order-0-data:
  mysql-order-0-replica-data:
  mysql-order-1-data:
  mysql-order-1-replica-data:
  mysql-order-2-data:
  mysql-order-2-replica-data:
  mysql-order-3-data:
  mysql-order-3-replica-data:
  redis-data:
  kafka-data:
