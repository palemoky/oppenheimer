{{- $name := include "service.name" . -}}
{{- $limit := int .Values.resources.memoryLimitMi -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  # 刚就绪就崩的 Pod 不算可用（设计文档 8.2）。
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy }}
    {{- if eq .Values.strategy "RollingUpdate" }}
    # 先起一个新的，就绪了再停一个旧的：就绪的副本数任何时刻都不低于期望值。
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: oppenheimer
        # 按 Pod 选择注入（命名空间不打 istio-injection 标签）：同一个命名空间里的测试 Job 不受影响。
        # 不注入的（cdc）显式写 "false"。
        sidecar.istio.io/inject: {{ ternary "true" "false" (not (empty (include "service.istioInject" .))) | quote }}
      annotations:
        # 配置变了，Pod 模板就变，helm upgrade 触发滚动更新（环境变量只在启动时读）。
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- if include "service.istioInject" . }}
        # 入站只接管 gRPC 端口；HTTP 端口（探针、gateway 对外的 8080）不过边车。没有 gRPC 的（gateway）写空字符串：
        # 不接管任何入站端口（不写这个注解的默认值是 "*"，全部接管）。
        traffic.sidecar.istio.io/includeInboundPorts: {{ ternary (toString (int .Values.ports.grpc)) "" (gt (int .Values.ports.grpc) 0) | quote }}
        # 探针不改写。Istio 默认把 HTTP 探针改成先打边车的 15020、由它转给应用，那是为“应用端口被边车接管、
        # kubelet 没有证书连不进来”准备的；这里 HTTP 端口不过边车，kubelet 直接探应用，少依赖一个进程。
        sidecar.istio.io/rewriteAppHTTPProbers: "false"
        # 中间件（MySQL、Redis、Sentinel、Kafka）的出站不过边车。
        traffic.sidecar.istio.io/excludeOutboundPorts: {{ .Values.istio.excludeOutboundPorts | quote }}
        {{- with .Values.istio.proxy.cpu }}
        sidecar.istio.io/proxyCPU: {{ . | quote }}
        {{- end }}
        {{- with .Values.istio.proxy.memory }}
        sidecar.istio.io/proxyMemory: {{ . | quote }}
        {{- end }}
        {{- with .Values.istio.proxy.memoryLimit }}
        sidecar.istio.io/proxyMemoryLimit: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # 每个服务一个 ServiceAccount：Istio 的工作负载身份（SPIFFE ID）由它来，后面的 mTLS、AuthorizationPolicy 按它认人。
      # 下面的 automountServiceAccountToken: false 照旧：Istio 的边车用自己的投射卷（istio-token），不受它影响。
      serviceAccountName: {{ $name }}
      # 服务不调 Kubernetes API，不挂令牌。
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        # 镜像是 distroless nonroot，用户名 nonroot；runAsNonRoot 要数字的 uid 才能校验。
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.avoidControlPlane }}
      # 不上控制面节点：它只有 6 GB，上面有 etcd、一个 Kafka broker 和两个 Redis，业务 Pod 再落上去内存用到过 86%
      #（设计文档 2c 第 13 节）。etcd 所在的节点被挤爆比两个副本偶尔同节点严重得多。
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      {{- end }}
      {{- if and .Values.spread (or .Values.autoscaling.enabled (gt (int .Values.replicas) 1)) }}
      # 同一个服务的副本尽量分到不同节点。是软约束（ScheduleAnyway）：能放的只有两个工作节点，
      # 滚动时多开的那个 Pod 必然和某个旧 Pod 同节点，硬约束会让它一直 Pending、滚动卡住。
      # 代价是不保证分散：一个节点不可用时两个副本可能都挤在另一个上，恢复后也不会自己挪回去。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "service.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" (required "image.repository is required (services.sh passes it)" .Values.image.repository) (required "image.tag is required (set IMAGE_TAG; never latest)" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            {{- if gt (int .Values.ports.grpc) 0 }}
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
          # env 的顺序有意义：被 $(...) 引用的变量必须排在引用它的前面（Kubernetes 只展开列表里已经定义的）。
          # 所以先是 Secret 来的密码，然后是固定的几项，最后才是引用密码的 DSN。
          env:
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ .key }}
            {{- end }}
            - name: HTTP_ADDR
              value: {{ printf ":%d" (int .Values.ports.http) | quote }}
            {{- if gt (int .Values.ports.grpc) 0 }}
            - name: GRPC_ADDR
              value: {{ printf ":%d" (int .Values.ports.grpc) | quote }}
            {{- end }}
            # Pod 的身份放进每条链路和指标的资源属性（Downward API）。在进程里写死比让 Collector 按来源地址
            # 去查 Kubernetes API 简单，也不会在 Pod 刚起来、Collector 的缓存还没同步时漏掉。
            # 不导出时（OTEL_EXPORTER_OTLP_ENDPOINT 为空）它们没有任何作用。
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              # service.version 用镜像的 tag（提交号）：镜像构建时不带 .git，进程自己读不到提交号（otelx.buildRevision 返回空）。
              value: "service.version={{ .Values.image.tag }},k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)"
            - name: DRAIN_DELAY
              value: {{ .Values.drainDelay | quote }}
            # 内存上限的 90%：Go 的垃圾回收不知道容器的上限，不设的话堆涨到被 OOM 杀掉之前都不加紧回收。
            - name: GOMEMLIMIT
              value: {{ printf "%dMiB" (div (mul $limit 9) 10) | quote }}
            {{- range .Values.expandEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            # 迁移、建 topic 要时间，第一次部署在空库上最慢。2 秒一次、最多 90 次，即 3 分钟。
            periodSeconds: 2
            failureThreshold: 90
          # 只回答“进程还能不能响应”，不看依赖：依赖坏了重启自己没有用，还会让所有副本一起重启。
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # 启动完成前和收到 SIGTERM 之后是 503。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: {{ .Values.resources.cpu }}
              memory: {{ .Values.resources.memoryRequestMi }}Mi
            limits:
              memory: {{ $limit }}Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # 根文件系统只读，给 os.TempDir 一个可写的地方。
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
