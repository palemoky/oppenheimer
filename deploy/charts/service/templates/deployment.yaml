{{- $name := include "service.name" . -}}
{{- $limit := int .Values.resources.memoryLimitMi -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # 刚就绪就崩的 Pod 不算可用（设计文档 8.2）。
  minReadySeconds: {{ .Values.minReadySeconds }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ .Values.strategy }}
    {{- if eq .Values.strategy "RollingUpdate" }}
    # 先起一个新的，就绪了再停一个旧的：就绪的副本数任何时刻都不低于期望值。
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: oppenheimer
      annotations:
        # 配置或边车配置变了，Pod 模板就变，helm upgrade 触发滚动更新（环境变量只在启动时读）。
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        {{- if .Values.sidecar.enabled }}
        checksum/sidecar: {{ .Values.sidecar.config | sha256sum }}
        {{- end }}
    spec:
      # 服务不调 Kubernetes API，不挂令牌。
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        # 镜像是 distroless nonroot，用户名 nonroot；runAsNonRoot 要数字的 uid 才能校验。
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- if and .Values.spread (gt (int .Values.replicas) 1) }}
      # 用分布约束而不是“必须不同节点”的反亲和：滚动时多出来的那个 Pod 可以落到第三个节点，不会卡住。
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "service.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- if .Values.sidecar.enabled }}
      # 原生 sidecar：边车先起来并就绪，服务才启动；服务容器全部退出之后才停边车（设计文档 6.1）。
      initContainers:
        - name: envoy
          image: {{ .Values.sidecar.image }}
          restartPolicy: Always
          args:
            - -c
            - /etc/envoy/envoy.yaml
            - --log-level
            - warn
            - --service-cluster
            - {{ $name }}
            - --service-node
            - envoy-{{ $name }}
          ports:
            - name: inbound
              containerPort: {{ .Values.sidecar.inboundPort }}
            - name: envoy-admin
              containerPort: {{ .Values.sidecar.adminPort }}
          startupProbe:
            httpGet:
              path: /ready
              port: envoy-admin
            # Envoy 要等出站集群的第一次 DNS 解析完成才就绪；下游的 headless Service 还不存在时可能要等一阵。
            periodSeconds: 2
            failureThreshold: 90
          # 存活只看进程能不能应答。/ready 在启动和排空时是 503，不能拿来重启。
          livenessProbe:
            httpGet:
              path: /server_info
              port: envoy-admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: envoy-admin
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: {{ .Values.sidecar.resources.cpu }}
              memory: {{ .Values.sidecar.resources.memoryRequestMi }}Mi
            limits:
              memory: {{ .Values.sidecar.resources.memoryLimitMi }}Mi
          securityContext:
            # Envoy 的镜像默认以 root 启动再降到 envoy（101）；这里直接以 101 运行，才能满足 runAsNonRoot。
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s:%s" (required "image.repository is required (services.sh passes it)" .Values.image.repository) (required "image.tag is required (set IMAGE_TAG; never latest)" .Values.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            {{- if gt (int .Values.ports.grpc) 0 }}
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
          # env 的顺序有意义：被 $(...) 引用的变量必须排在引用它的前面（Kubernetes 只展开列表里已经定义的）。
          # 所以先是 Secret 来的密码，然后是固定的几项，最后才是引用密码的 DSN。
          env:
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ .key }}
            {{- end }}
            - name: HTTP_ADDR
              value: {{ printf ":%d" (int .Values.ports.http) | quote }}
            {{- if gt (int .Values.ports.grpc) 0 }}
            - name: GRPC_ADDR
              value: {{ printf ":%d" (int .Values.ports.grpc) | quote }}
            {{- end }}
            - name: DRAIN_DELAY
              value: {{ .Values.drainDelay | quote }}
            # 内存上限的 90%：Go 的垃圾回收不知道容器的上限，不设的话堆涨到被 OOM 杀掉之前都不加紧回收。
            - name: GOMEMLIMIT
              value: {{ printf "%dMiB" (div (mul $limit 9) 10) | quote }}
            {{- range .Values.expandEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            # 迁移、建 topic 要时间，第一次部署在空库上最慢。2 秒一次、最多 90 次，即 3 分钟。
            periodSeconds: 2
            failureThreshold: 90
          # 只回答“进程还能不能响应”，不看依赖：依赖坏了重启自己没有用，还会让所有副本一起重启。
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # 启动完成前和收到 SIGTERM 之后是 503。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: {{ .Values.resources.cpu }}
              memory: {{ .Values.resources.memoryRequestMi }}Mi
            limits:
              memory: {{ $limit }}Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # 根文件系统只读，给 os.TempDir 一个可写的地方。
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.sidecar.enabled }}
        - name: envoy-config
          configMap:
            name: {{ $name }}-envoy
        {{- end }}
