{{- if and .Values.route.enabled .Values.route.circuitBreaker }}
# 入口的 Envoy 到这个服务的并发上限（设计文档 3b、3b 第 3 轮的记录）。只有 gateway 开。
#
# 不写这个资源时 Envoy Gateway 也有上限，用的是 Envoy 的默认值（连接 1024、排队 1024），3b 第 0 轮撞到过：
# 系统一慢，在途请求超过上限，入口直接答 503（response flags 是 UO），这些请求没有到达 gateway，
# gateway 自己的指标和日志里看不到。写出来是为了让这两个数在仓库里有出处、能调；
# 入口这一侧的计数见 deploy/cluster/monitoring/ingress-podmonitor.yaml。
#
# 三个数各管什么（入口到 gateway 是 HTTP/1.1，一个在途的请求占一条连接）：
#   maxParallelRequests  在途请求数的上限，超过的直接答 503（UO）。管并发的是它。
#                        这里原来写过“只对 HTTP/2 的上游起作用”，是错的：2026-11-22 实测 HTTP/1.1 的上游在途到 1024 时
#                        入口答 503，访问日志里是 upstream_reset_before_response_started{overflow}，排队并没有满。
#                        不写时 Envoy Gateway 填 1024。
#   maxConnections       连接总数的上限，连接用完之后新请求排队等连接。
#   maxPendingRequests   排队的上限，再多的被拒绝（同样是 503 UO）。
#
# maxConnections 数的是所有连接，不分忙闲（3b 扩容系数那一轮的记录第 4.1 节）：Envoy 的连接池按
# “工作线程 × 上游主机”分开，请求先选主机，再到这个线程对这个主机的池子里找空闲连接，没有就新建，
# 别的池子里闲着的借不到。上游的副本越多，闲着的连接越多，上限会在在途请求还很少的时候被占满。
# 所以 maxConnections 不能当并发上限用：它要远大于 maxParallelRequests（实测连接数是在途请求数的三到六倍），并且用 connectionIdleTimeout 让闲连接及时关掉
# （Envoy 的默认值是 1 小时）。空闲超时要短于上游自己关闭空闲连接的时间，否则入口会把请求发到上游正在关的连接上；
# gateway 的 HTTP 服务不主动关空闲连接（pkg/app/http.go 没有设 IdleTimeout）。
#
# 不配重试：重试只有一层，在客户端（带幂等键），见 AGENTS.md 的重试规则。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "service.name" . }}
  circuitBreaker:
    maxConnections: {{ required "route.circuitBreaker.maxConnections is required" .Values.route.circuitBreaker.maxConnections }}
    maxPendingRequests: {{ required "route.circuitBreaker.maxPendingRequests is required" .Values.route.circuitBreaker.maxPendingRequests }}
    {{- with .Values.route.circuitBreaker.maxParallelRequests }}
    maxParallelRequests: {{ . }}
    {{- end }}
  {{- with .Values.route.circuitBreaker.connectionIdleTimeout }}
  timeout:
    http:
      connectionIdleTimeout: {{ . }}
  {{- end }}
{{- end }}
