# 每个服务一个 ServiceAccount：Istio 按它给工作负载发身份证书（spiffe://<域>/ns/<命名空间>/sa/<名字>）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
# 服务不调 Kubernetes API。Pod 上也写了同样的一项，这里再写一遍，免得以后别的 Pod 用它时挂上令牌。
automountServiceAccountToken: false
