# 公共 chart 的默认值。每个服务的差别在 deploy/cluster/services/<服务>.yaml。
# release 名就是服务名（order 等），所有资源名都从它来。

# 镜像的仓库和 tag 由 scripts/cluster/services.sh 用 --set 传入（仓库地址在 cluster.env，tag 来自 IMAGE_TAG）。
# 不给默认值：没传就渲染失败，不会悄悄用上 latest。
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1
# 按 CPU 的 HPA（templates/hpa.yaml）。开了之后 Deployment 不再写 replicas：副本数归 HPA 管，
# 否则每次 helm upgrade 都会把它改回 values 里的数，和 HPA 打架。上面的 replicas 这时不起作用。
# targetCPUUtilization 是对 CPU requests 的百分比。
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilization: 70
# 滚动：maxSurge 1、maxUnavailable 0（设计文档 8.2）。cdc 换成 Recreate：同一时刻只能有一个读 binlog 的实例。
strategy: RollingUpdate
minReadySeconds: 5
# 要大于 DRAIN_DELAY 加停止时限（20 秒）加边车退出的时间（设计文档 8.1）。不用 preStop。
terminationGracePeriodSeconds: 45
# 5 秒：Istio 下端点的变化经 xDS 推送，实测 Pod 收到 SIGTERM 之后 0.5 秒内就不再有新请求进来（设计文档 2d 第 10 节）。
# 手写边车靠 DNS 时最长要 9.5 秒，那时是 15 秒；MESH_ISTIO= 退回手写边车时要改回 15s。
drainDelay: 5s

# 服务容器监听的端口。chart 把它们同时渲染成 HTTP_ADDR、GRPC_ADDR（监听所有地址，探针才连得到）。
# grpc 为 0 表示没有 gRPC（gateway 的 HTTP 是对外的，cdc 没有 gRPC）。
ports:
  http: 8080
  grpc: 0

# 服务容器的资源。内存用数字，单位 Mi：同时渲染出 limits.memory 和 GOMEMLIMIT（上限的 90%）。
# CPU 只设 requests，不设 limits（避免节流带来的延迟长尾）。QoS 是 Burstable。
resources:
  cpu: 100m
  memoryRequestMi: 128
  memoryLimitMi: 512

# 普通环境变量，进 ConfigMap，envFrom 整个注入。内容变了 Pod 模板上的校验和就变，触发滚动。
# 注意：envFrom 来的变量不能被 $(...) 引用。
config: {}

# 密码：从 Secret 取。secretName 是本命名空间里的 Secret（services.sh 从 mysql 命名空间复制）。
# 这些变量排在 env 列表的最前面，expandEnv 里的 $(变量名) 才能引用它们（被引用的必须在前面）。
secretName: oppenheimer-mysql
secretEnv: []          # - {name: MYSQL_ORDER_0_PASSWORD, key: order-0-app-password}
# 引用上面变量的环境变量（DSN 在这里拼），原样写进 env。
expandEnv: []          # - {name: MYSQL_DSN, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(...)/db"}

# 同一个服务的副本分散到不同节点（和入口 Envoy 同样的写法：滚动时多出来的那个可以落到第三个节点）。
# 不调度到控制面节点（见 deployment.yaml 里的说明）。
avoidControlPlane: true
spread: true

pdb:
  enabled: true        # maxUnavailable: 1。cdc 只有一个实例，关掉

# 普通 ClusterIP Service（<名字>），暴露服务的 HTTP 端口：给不经过边车的访问用（入口到 gateway、调试）。
# grpcPort：ports.grpc 大于 0 时再暴露 gRPC 端口（端口名 grpc）。mesh: istio 时无条件有这个端口（调用方经它调用）；
# mesh: envoy 时默认不开，迁移的准备阶段打开（scripts/cluster/services.sh 的 SERVICE_GRPC_PORT=1）：
# 已经切到 Istio 的调用方连得到还没切的被调用方。
service:
  enabled: true
  grpcPort: false
# headless Service（<名字>-headless），暴露边车的入站端口：调用方的边车 STRICT_DNS 解析它得到所有就绪的 Pod。
# 只在手写边车开着时才有意义（mesh: istio 时不渲染）；没有入站监听的服务（gateway）自己关掉。
headless:
  enabled: true

# 服务之间的 gRPC 走哪种边车（设计文档 2d）：
#   envoy  chart 里手写的 Envoy 边车（下面的 sidecar、headless），迁移前的现状
#   istio  Istio 自动注入的边车：不渲染手写边车的任何东西，Pod 上打注入标签，每个服务一个 ServiceAccount，
#          Service 上暴露 gRPC 端口。流量规则在 deploy/cluster/mesh/（services.sh 先于 release 应用）
# 迁移时逐个服务切（scripts/cluster/services.sh 的 MESH_ISTIO），两种形态在同一个命名空间里共存。
mesh: envoy

# 只在 mesh: istio 时起作用。
istio:
  # 注入边车。只有服务之间的 gRPC 要过边车：有 gRPC 入站的服务（ports.grpc > 0）和只有出站的 gateway 注入，
  # 没有任何 gRPC 的 cdc 关掉（它的 values 叠加层里设 false）。关掉时 Pod 上显式写 inject: "false"。
  inject: true
  # 不过边车的出站端口：MySQL、Redis、Redis Cluster 总线、Sentinel、Kafka。它们不是 HTTP/gRPC，
  # 边车除了多一跳什么也不做；Redis Cluster、Kafka 还会按节点地址直连，经边车只会多出一层要排查的东西。
  excludeOutboundPorts: "3306,6379,16379,26379,9092"
  # 边车的资源。默认不设，用网格的全局默认值（deploy/cluster/istio/：requests 50m / 64Mi，上限 192Mi）。
  # 设了哪一项才渲染哪一项的注解：cpu -> proxyCPU，memory -> proxyMemory，memoryLimit -> proxyMemoryLimit（如 "256Mi"）。
  proxy:
    cpu: ""
    memory: ""
    memoryLimit: ""

# Pod 模板上额外的注解，原样加在 chart 自己的注解之后。默认没有。
# 现在只有故障注入（deploy/cluster/services/fault/gateway.yaml）用它打开边车的统计项（proxy.istio.io/config）。
podAnnotations: {}

# Envoy 边车（原生 sidecar：initContainers 里 restartPolicy: Always），设计文档 6.1。mesh: istio 时不起作用。
sidecar:
  enabled: true
  image: envoyproxy/envoy:v1.40.2
  # 配置内容（Envoy 的 yaml）。由部署脚本用 --set-file 传入渲染过的 deploy/envoy/<服务>.yaml，不在 chart 里另存一份。
  config: ""
  inboundPort: 15001
  adminPort: 9901
  resources:
    cpu: 20m
    memoryRequestMi: 32
    memoryLimitMi: 192

# 对外路由，挂到入口的 Gateway（2a）。只有 gateway 开。
route:
  enabled: false
  hostnames: []
  parentRef:
    name: public
    namespace: envoy-gateway-system
