# 默认值。每个实例的差异写在 deploy/cluster/mysql/<release>.yaml。
image: mysql:9.7.4

# 2 是一主一从，1 是单实例。不支持更多（-replica Service 按 Pod 名选“另一个序号”，见 templates/services.yaml）。
replicas: 2

# 主库是哪个序号。-primary Service 按 Pod 名指向它，-replica 指向另一个。初始是 0。
# 人工切换的最后一步是改这里再 helm upgrade：只改 Service，不重启 Pod。
primaryOrdinal: 0

# 从库提交时的落盘方式。主库永远是 strict，不受这里影响；落盘方式跟着实例当前的角色走，不跟着序号
# （files/durability.sh，决定和取舍见 ADR-0032）。
#   strict   innodb_flush_log_at_trx_commit=1、sync_binlog=1：每次提交 redo 和 binlog 各刷一次盘。
#   relaxed  innodb_flush_log_at_trx_commit=2、sync_binlog=0：提交时只写到操作系统，约每秒刷一次。
#            mysqld 被杀、Pod 被删都不丢（数据在页缓存里）；从库所在的节点掉电或内核崩溃时，
#            它的数据和它自己的 binlog 可能互相对不上，这个从库必须从主库重建（docs/infra/mysql-switchover.md 第三节）。
replicaDurability: strict

# 有状态中间件的优先级（deploy/cluster/middleware/priorityclass.yaml，由 middleware.sh 先建好）。
# 内存 requests 等于 limits 但 CPU 不设 limits，QoS 是 Burstable 而不是 Guaranteed，靠优先级排在业务服务之后被驱逐。
priorityClassName: ""

# server-id = serverIdBase + 序号，在容器启动时从 Pod 名算出来。各实例的基数不能重叠，
# 也不能和 CDC 用的 server-id（docs/infra/versions.md 里登记的 1011、1021 等）冲突。
serverIdBase: 11

# 序号 0 第一次调度时偏好的节点（空表示不偏好）。只影响第一次：local-path 的卷建好之后 Pod 就固定在那个节点上。
preferredNode: ""

# 这个实例上要建的库。app 账号对它们有全部权限。
databases: []

# 是否建 cdc 账号。CDC 只读订单分片的 binlog，共享实例上不需要。
cdc:
  enabled: false

mysqld:
  maxConnections: 200
  innodbBufferPoolSize: 512M
  # binlog 保留多久（秒）。MySQL 的默认值是 30 天，2026-11-22 以前没有配过：长稳 125 单/秒时 mysql-main 每小时写
  # 1.4 GiB 的 binlog、订单库每个实例 0.83 GiB（从库开着 log_replica_updates，也写一份），30 天放不下
  # （3b 的记录 round-9-soak.md 第 3 节）。定 1 天：同一个节点上三个实例加一个 broker 的稳态约 93 GiB，盘放得下。
  # 下限由谁要读旧的 binlog 决定：CDC 停了超过这个时间，位点就被清掉，要重做全量（设计文档 1c 的 4.5、4.6）；
  # CDC 的全量读也要在这个时间内读完。从库断开超过这个时间要重新 CLONE（切换手册本来就是一律重建）。
  # 备份是 mysqldump 的逻辑备份，恢复不依赖 binlog。
  binlogExpireLogsSeconds: 86400

resources:
  memory: 1Gi
  cpu: 250m

storage:
  storageClass: local-path
  size: 20Gi

clusterDomain: cluster.local

# 建库建账号的 hook Job。只跑一个 mysql 客户端，给很小的内存就够。
accountsJob:
  memory: 128Mi
  cpu: 50m
  # 等主库可用的上限（秒）。第一次安装要拉镜像、初始化数据目录，给足时间。
  waitSeconds: 900

# 每天一次的逻辑备份（CronJob，脚本是 files/backup.sh），写到 NAS。默认关；开了之后要先有 PVC（claimName），
# 它由 middleware.sh 在装 chart 之前从 deploy/cluster/mysql/backup-pv.yaml 建好。
backup:
  enabled: false
  # cron 表达式，按 UTC（不设 timeZone，不依赖控制器里的时区数据库）。三个实例在各自的 values 里错开。
  schedule: "0 19 * * *"
  # 备份目录所在的 PVC，三个实例共用，每个实例在里面用 <release>/ 子目录。
  claimName: mysql-backup
  # 保留最近几份。
  keep: 7
  # 错过计划时间多久之内还补跑（集群或控制器停了一阵）。超过就放弃这一次。
  startingDeadlineSeconds: 3600
  # 一次备份最长跑多久，超时 Job 失败。也决定“多老的 .tmp-* 目录算失败留下的”。
  activeDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # 原来写的是“mysqldump 加 zstd，内存用量很小；dump 是流式的”，给了 256Mi。库里只有几万行时成立；
  # 2026-11-18 灌到每个分片 500 万单之后，两个订单库的备份 Job 开始十几秒就被 OOMKilled（mysql-main 的没有）。
  # 实际用量见设计文档 3b 第 6 节。
  memory: 1Gi
  cpu: 100m
