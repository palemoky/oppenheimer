image:
  repository: redis
  tag: "8.10.3"
  pullPolicy: IfNotPresent

clusterDomain: cluster.local

redis:
  replicas: 2
  # 库存等数据不能被淘汰，内存满时宁可写入报错。
  maxmemory: 192mb
  maxmemoryPolicy: noeviction
  # Redis 自己的延迟监控（LATENCY LATEST / LATENCY HISTORY）：主线程被卡住超过这么多毫秒就记一笔，并且分了类
  # （fork、aof-write、aof-fsync-always、command、expire-cycle …）。0 是关。只记录，不改行为，开销可以忽略。
  # 开它的原因：2026-11-27 order 往闸门做 Hold 的 300 毫秒时限被撞到 20 次，其中一簇的原因查不出来
  # （指标 30 秒一个点，看不到几百毫秒的停顿；docs/plan/phase-4-chaos.md“4b 实验清单”）。定 100：调用方的时限的三分之一。
  latencyMonitorThresholdMs: 100
  storage: 2Gi
  storageClass: local-path
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 256Mi}

sentinel:
  replicas: 3
  masterName: gate
  quorum: 2
  downAfterMilliseconds: 5000
  failoverTimeout: 30000
  parallelSyncs: 1
  storage: 100Mi
  storageClass: local-path
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 64Mi}

# PriorityClass 的名字，空表示不设。集群上用 middleware（由 middleware.sh 先建好）。
priorityClassName: ""
