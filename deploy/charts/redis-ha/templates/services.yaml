# 无头服务：给每个 Pod 稳定的域名。publishNotReadyAddresses 让还没就绪的 Pod 也能解析，
# 否则启动时互相找不到对方（Sentinel 要先解析主库域名才能起来）。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-ha.name" . }}
  labels: {{- include "redis-ha.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "redis-ha.redisSelector" . | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-ha.sentinelHeadless" . }}
  labels: {{- include "redis-ha.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "redis-ha.sentinelSelector" . | nindent 4 }}
  ports:
    - {name: sentinel, port: 26379, targetPort: sentinel}
---
# 客户端和 Redis 启动脚本用这个：只路由到就绪的 Sentinel。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-ha.sentinelName" . }}
  labels: {{- include "redis-ha.labels" . | nindent 4 }}
spec:
  selector: {{- include "redis-ha.sentinelSelector" . | nindent 4 }}
  ports:
    - {name: sentinel, port: 26379, targetPort: sentinel}
