apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "redis-ha.name" . }}
  labels: {{- include "redis-ha.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "redis-ha.redisSelector" . | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "redis-ha.sentinelName" . }}
  labels: {{- include "redis-ha.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "redis-ha.sentinelSelector" . | nindent 6 }}
