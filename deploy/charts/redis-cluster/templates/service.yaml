# 无头服务给每个 Pod 稳定的域名；publishNotReadyAddresses 让还没就绪的 Pod 也能解析（组建集群时要用）。
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-cluster.name" . }}
  labels: {{- include "redis-cluster.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "redis-cluster.selector" . | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
    - {name: bus, port: 16379, targetPort: bus}
