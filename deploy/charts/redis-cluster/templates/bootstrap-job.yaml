# 组建集群用 Helm 的 post-install/post-upgrade hook：helm install --wait 返回时集群已经好了，
# 不需要主会话的脚本再协调。脚本可重复执行：集群已经好就什么都不做。
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "redis-cluster.name" . }}-bootstrap
  labels: {{- include "redis-cluster.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # 保留上一次的 Job 到下一次 hook 之前，方便 kubectl logs 看主从对应。
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      # Pod 不能带 Redis 那一套标签（app.kubernetes.io/name: redis-cluster 加 instance）：PDB 和 headless Service
      # 都按它们选 Pod。这个 Job 的 Pod 做完之后还留着，原来它被 PDB 选中，PDB 要算“应该有几个 Pod”时
      # 去问它的控制器（Job）要副本数，Job 没有 scale 子资源，于是 PDB 一直是 SyncFailed、
      # 允许的中断数是 0：排空任何一个有 Redis 的节点都会被卡住（2026-11-15 发现，设计文档 2b 发现 16）。
      labels:
        app.kubernetes.io/name: redis-cluster-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: bootstrap
          image: {{ include "redis-cluster.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            - {name: NAME, value: {{ include "redis-cluster.name" . | quote }}}
            - {name: HEADLESS, value: {{ include "redis-cluster.name" . | quote }}}
            - {name: SUFFIX, value: {{ include "redis-cluster.suffix" . | quote }}}
            - {name: REPLICAS, value: {{ .Values.replicas | quote }}}
            - {name: REPLICAS_PER_MASTER, value: {{ .Values.replicasPerMaster | quote }}}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: scripts
          configMap: {name: {{ include "redis-cluster.name" . }}}
