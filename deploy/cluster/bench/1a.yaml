            - {name: GRPC_ADDR, value: ":9083"}
            - {name: LOG_LEVEL, value: warn}
            - {name: GOMEMLIMIT, value: 460MiB}
            - {name: WORKER_ID, value: "3"}
            - {name: ORDER_ADDR, value: "order-1a:9081"}
            - name: MYSQL_DSN
              value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/bench1a_payment_db"
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 90}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, timeoutSeconds: 2, failureThreshold: 2}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
