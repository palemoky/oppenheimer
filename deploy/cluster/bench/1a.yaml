        - {name: tmp, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-1a
  labels: {app.kubernetes.io/name: gateway-1a, app.kubernetes.io/part-of: oppenheimer-bench1a}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: gateway-1a}
  template:
    metadata:
      labels: {app.kubernetes.io/name: gateway-1a, app.kubernetes.io/part-of: oppenheimer-bench1a}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 25
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
      containers:
        - name: gateway
          image: "__IMAGE_PREFIX__/gateway-1a:__TAG__"
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: HTTP_ADDR, value: ":8080"}
            - {name: LOG_LEVEL, value: warn}
            - {name: GOMEMLIMIT, value: 460MiB}
            # 1a 的 gateway 没有限流，也没有 TRUSTED_PROXIES。下游直连（见文件开头）。
            - {name: ORDER_ADDR, value: "order-1a:9081"}
            - {name: INVENTORY_ADDR, value: "inventory-1a:9082"}
            - {name: PAYMENT_ADDR, value: "payment-1a:9083"}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 90}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, timeoutSeconds: 2, failureThreshold: 2}
          resources:
            requests: {cpu: 200m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
