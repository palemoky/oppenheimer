# istiod（Istio 的控制面）的 values，chart 是发布包里的 manifests/charts/istio-control/istio-discovery。
# 设计文档 2d（docs/design/2d-mesh.md），ADR-0029。由 scripts/cluster/mesh.sh up 使用。
# 镜像的版本跟着 chart 走（docker.io/istio/pilot、proxyv2，tag 是 chart 的版本），这里不写。

# 一个副本，不要它自带的 HPA：十几个边车的网格用不着，内存也放不下第二个。
# 代价要知道：istiod 不在的时候，已经在跑的边车用最后一份配置继续工作，但端点的变化推不下去；
# 注入的 webhook 的失败策略是 Fail，所以业务命名空间里建不出新 Pod（滚动发布、HPA 扩容、删掉重建都会卡住）。
autoscaleEnabled: false
replicaCount: 1

# 默认是 500m、2 Gi，是给大网格的。这里的数是估的，装上之后按 kubectl top 改（设计文档第 6 节）。
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# 不上控制面节点，和业务服务同样的理由：它只有 6 GB，上面有 etcd（deploy/charts/service 的 avoidControlPlane）。
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

meshConfig:
  # 同步调用链上不重试（设计文档 1d 的 5.6）。Istio 的默认是重试 2 次，条件里有 gRPC 的 unavailable：
  # 下游返回 UNAVAILABLE 的写请求会被边车再发两次。每条调用边的 VirtualService 里还会各写一遍 attempts: 0，
  # 这里是兜底：漏写某条路由时的结果是不重试，而不是悄悄重试。
  defaultHttpRetryPolicy:
    attempts: 0
  # 入站一侧（被调用方的边车转给本机进程）的默认重试，1.32 起可配，同样关掉。
  defaultInboundHttpRetryPolicy: {}
  # 网格以外的地址照常放行（中间件、集群外）。这是默认值，写出来是因为设计依赖它。
  outboundTrafficPolicy:
    mode: ALLOW_ANY
  # 边车的访问日志先不开（阶段 3 接入日志系统时再定格式和去向）。
  accessLogFile: ""
  # 边车默认导出的统计里没有集群级的摘除和并发上限溢出（设计文档 3a、ADR-0030 第 7 项），这里全网格常开，只开这几项：
  #   upstream_rq_active_overflow、upstream_rq_pending_overflow、upstream_cx_overflow
  #                                                        并发上限（connectionPool）触发的次数，请求被边车直接拒绝（响应标志 UO）。
  #                                                        gRPC（HTTP/2）在途请求数超过 http2MaxRequests 记的是 active 那一项：
  #                                                        2026-11-17 的故障注入里 144 个被拒绝的请求全在它上面，另外两项是 0
  #                                                        （一开始没有留 active，大盘上那一格在真的溢出时是空的，设计文档 3a 第 8 节“验证 6”）
  #   outlier_detection.ejections_*                        outlierDetection 摘除的次数、当前被摘除的主机数
  # 名字是 Envoy 的原始统计名，形如 cluster.outbound|9082||inventory.oppenheimer.svc.cluster.local.<统计项>，
  # 正则必须匹配整个名字；只匹配出站的集群（outbound|），入站的集群没有这些限制。每个边车每个出站集群约 7 条。
  # 它写进 Pod 的启动配置，已经在跑的边车要重启（重新注入）才生效；Pod 上自己写了 proxyStatsMatcher 注解的（fault/gateway.yaml）以注解为准，
  # 这里的不再起作用（是覆盖，不是合并：实测带注解的 gateway 只有注解匹配的那一个集群有这些统计）。
  defaultConfig:
    proxyStatsMatcher:
      inclusionRegexps:
        - 'cluster\.outbound\|.*\.upstream_rq_active_overflow'
        - 'cluster\.outbound\|.*\.upstream_rq_pending_overflow'
        - 'cluster\.outbound\|.*\.upstream_cx_overflow'
        - 'cluster\.outbound\|.*\.outlier_detection\.ejections_(active|total|enforced_total|enforced_consecutive_5xx|overflow)'

global:
  proxy:
    # 注入出来的边车的默认资源。默认值是 100m / 128 Mi、上限 2 核 / 1 Gi；手写的边车实际只用 16 到 18 Mi。
    # 估的，装上之后按实际用量改。CPU 不设上限，和业务容器一致（被节流会造成延迟的长尾）。
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        # Helm 按键合并 values：只写 memory 的话默认的 cpu: 2000m 还留着，要显式置空才去得掉。
        cpu: null
        memory: 192Mi
  # 节点上的 iptables 是 nf_tables 后端（iptables v1.8.11）。先用默认的写法（经 iptables 命令），
  # 在临时 Pod 上验证规则写得进去；不行再把这个改成 true。
  nativeNftables: false
