# Prometheus 的 remote write 接收端挂到入口上，给集群外的发压机（Mac mini 上的 k6）写客户端指标用
# （设计文档 3b 第 2 节第 7 项）。只放行写入这一个路径：查询接口和界面仍然不对外
# （用 scripts/cluster/monitoring.sh forward）。入口的地址只在局域网里可达；这个路径没有鉴权，
# 局域网里的任何设备都能往里写序列，这是练习环境接受的代价。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-write
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: envoy-gateway-system
  hostnames:
    - __PROM_WRITE_HOST__
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/write
          method: POST
      backendRefs:
        - name: kps-prometheus
          port: 9090
