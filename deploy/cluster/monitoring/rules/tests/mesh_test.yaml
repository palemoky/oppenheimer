# 网格和入口的告警的单元测试（rules/mesh.yaml）。每条至少一个“该响”和一个“不该响”；
# “有增长”类的再加一个“计数器第一次出现”的用例（设计 1.3 第 1 条）。
# 输入每分钟一个点，规则每分钟求值一次（evaluation_interval 1m）。断言读 ALERTS 的 firing。
rule_files:
  - ../mesh.yaml
evaluation_interval: 1m

tests:

  # 入口排队溢出的计数器从 t=10m 起每分钟 +1：窗口 5m 里有增长、持续 2 分钟，20m 时在响（signal=queue）。
  - name: ingress_pending_overflow_fires
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_pending_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="e1"}'
        values: '0x10 1+1x30'
    promql_expr_test:
      - expr: count by (alertname, envoy_cluster_name, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 9m
        exp_samples: []
      - expr: count by (alertname, envoy_cluster_name, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: '{alertname="IngressRejectingRequests", envoy_cluster_name="httproute/oppenheimer/gateway/rule/0", signal="queue"}'
            value: 1

  # 连接数上限溢出（cx_overflow）同理，signal=conn。
  - name: ingress_conn_overflow_fires
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_cx_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="e1"}'
        values: '0x10 1+1x30'
    promql_expr_test:
      - expr: count by (alertname, envoy_cluster_name, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: '{alertname="IngressRejectingRequests", envoy_cluster_name="httproute/oppenheimer/gateway/rule/0", signal="conn"}'
            value: 1

  # 计数器一直是 0（Envoy 建集群时的状态）：不响。
  - name: ingress_no_overflow_silent
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_pending_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="e1"}'
        values: '0x40'
      - series: 'envoy_cluster_upstream_cx_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="e1"}'
        values: '0x40'
    promql_expr_test:
      - expr: count by (alertname, envoy_cluster_name, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 30m
        exp_samples: []

  # 设计 1.3 第 1 条：计数器 t=10m 才第一次出现、一出现就是 7（之前没有序列）。increase() 看不到增长（只有一个起点），
  # 靠“x > 0 unless x offset 5m”那半边：13m 在响；出现满 5 分钟之后那半边失效，30m 不响（计数器没有再涨）。
  - name: ingress_first_appearance_fires
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_pending_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="e1"}'
        values: '_x10 7x30'
    promql_expr_test:
      - expr: count by (alertname, envoy_cluster_name, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 9m
        exp_samples: []
      - expr: count by (alertname, envoy_cluster_name, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 13m
        exp_samples:
          - labels: '{alertname="IngressRejectingRequests", envoy_cluster_name="httproute/oppenheimer/gateway/rule/0", signal="queue"}'
            value: 1
      - expr: count by (alertname, envoy_cluster_name, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 30m
        exp_samples: []

  # 边车的并发上限溢出：两个源 Pod 里有一个在涨，按目标服务聚合，20m 在响。
  - name: mesh_active_overflow_fires
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_active_overflow{job="monitoring/istio-proxy",namespace="oppenheimer",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-1"}'
        values: '0x10 2+2x30'
      - series: 'envoy_cluster_upstream_rq_active_overflow{job="monitoring/istio-proxy",namespace="oppenheimer",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-2"}'
        values: '0x40'
    promql_expr_test:
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshConcurrencyLimitOverflow",alertstate="firing"})
        eval_time: 9m
        exp_samples: []
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshConcurrencyLimitOverflow",alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: '{alertname="MeshConcurrencyLimitOverflow", cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local"}'
            value: 1

  # 没有增长：不响。
  - name: mesh_active_overflow_silent
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_active_overflow{job="monitoring/istio-proxy",namespace="oppenheimer",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-1"}'
        values: '0x40'
    promql_expr_test:
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshConcurrencyLimitOverflow",alertstate="firing"})
        eval_time: 30m
        exp_samples: []

  # oppenheimer-e2e 里的溢出是故意制造的：不响。
  - name: mesh_active_overflow_e2e_ignored
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_active_overflow{job="monitoring/istio-proxy",namespace="oppenheimer-e2e",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-1"}'
        values: '0x10 2+2x30'
    promql_expr_test:
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshConcurrencyLimitOverflow",alertstate="firing"})
        eval_time: 20m
        exp_samples: []

  # 计数器第一次出现就是 9：靠“第一次出现”那半边，t=12m 在响（出现后 for 2m）。
  - name: mesh_active_overflow_first_appearance
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_active_overflow{job="monitoring/istio-proxy",namespace="oppenheimer",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-1"}'
        values: '_x10 9x30'
    promql_expr_test:
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshConcurrencyLimitOverflow",alertstate="firing"})
        eval_time: 13m
        exp_samples:
          - labels: '{alertname="MeshConcurrencyLimitOverflow", cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local"}'
            value: 1

  # 摘除计数 t=11m 从 0 变成 1：10m 窗口里有增长，12m 起响；窗口过去之后（40m）不响。
  - name: mesh_ejection_fires
    interval: 1m
    input_series:
      - series: 'envoy_cluster_outlier_detection_ejections_enforced_total{job="monitoring/istio-proxy",namespace="oppenheimer",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-1"}'
        values: '0x10 1x40'
    promql_expr_test:
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshEndpointEjected",alertstate="firing"})
        eval_time: 9m
        exp_samples: []
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshEndpointEjected",alertstate="firing"})
        eval_time: 15m
        exp_samples:
          - labels: '{alertname="MeshEndpointEjected", cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local"}'
            value: 1
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshEndpointEjected",alertstate="firing"})
        eval_time: 40m
        exp_samples: []

  # 一直是 0：不响。
  - name: mesh_ejection_silent
    interval: 1m
    input_series:
      - series: 'envoy_cluster_outlier_detection_ejections_enforced_total{job="monitoring/istio-proxy",namespace="oppenheimer",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-1"}'
        values: '0x40'
    promql_expr_test:
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshEndpointEjected",alertstate="firing"})
        eval_time: 30m
        exp_samples: []

  # 摘除计数 t=10m 第一次出现、一出现就是 3：第一次出现的那半边抓到，13m 在响。
  - name: mesh_ejection_first_appearance
    interval: 1m
    input_series:
      - series: 'envoy_cluster_outlier_detection_ejections_enforced_total{job="monitoring/istio-proxy",namespace="oppenheimer",cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local",pod="gw-1"}'
        values: '_x10 3x40'
    promql_expr_test:
      - expr: count by (alertname, cluster_name) (ALERTS{alertname="MeshEndpointEjected",alertstate="firing"})
        eval_time: 13m
        exp_samples:
          - labels: '{alertname="MeshEndpointEjected", cluster_name="outbound|9082||inventory.oppenheimer.svc.cluster.local"}'
            value: 1

  # KEDA 的错误计数 t=10m 起每分钟 +1，15m 在响。
  - name: keda_errors_fires
    interval: 1m
    input_series:
      - series: 'keda_scaler_detail_errors_total{exported_namespace="oppenheimer",scaledObject="gateway",namespace="keda"}'
        values: '0x10 1+1x30'
    promql_expr_test:
      - expr: count by (alertname, scaledObject) (ALERTS{alertname="KedaScalerErrors",alertstate="firing"})
        eval_time: 9m
        exp_samples: []
      - expr: count by (alertname, scaledObject) (ALERTS{alertname="KedaScalerErrors",alertstate="firing"})
        eval_time: 15m
        exp_samples:
          - labels: '{alertname="KedaScalerErrors", scaledObject="gateway"}'
            value: 1

  # 一直是 0：不响；别的命名空间（e2e）的对象在涨也不响。
  - name: keda_errors_silent
    interval: 1m
    input_series:
      - series: 'keda_scaler_detail_errors_total{exported_namespace="oppenheimer",scaledObject="gateway",namespace="keda"}'
        values: '0x40'
      - series: 'keda_scaler_detail_errors_total{exported_namespace="oppenheimer-e2e",scaledObject="order",namespace="keda"}'
        values: '0x10 1+1x30'
    promql_expr_test:
      - expr: count by (alertname, scaledObject) (ALERTS{alertname="KedaScalerErrors",alertstate="firing"})
        eval_time: 30m
        exp_samples: []

  # 错误计数 t=10m 第一次出现就是 5：靠第一次出现的那半边，13m 在响。
  - name: keda_errors_first_appearance
    interval: 1m
    input_series:
      - series: 'keda_scaler_detail_errors_total{exported_namespace="oppenheimer",scaledObject="gateway",namespace="keda"}'
        values: '_x10 5x40'
    promql_expr_test:
      - expr: count by (alertname, scaledObject) (ALERTS{alertname="KedaScalerErrors",alertstate="firing"})
        eval_time: 13m
        exp_samples:
          - labels: '{alertname="KedaScalerErrors", scaledObject="gateway"}'
            value: 1

  # ScalingActive 的 status="true" 序列 t=30m 起变成 0，持续 5 分钟：40m 在响。
  - name: keda_hpa_inactive_fires
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_condition{namespace="oppenheimer",horizontalpodautoscaler="keda-hpa-gateway",condition="ScalingActive",status="true"}'
        values: '1x30 0x30'
    promql_expr_test:
      - expr: count by (alertname, horizontalpodautoscaler) (ALERTS{alertname="KedaHPAScalingInactive",alertstate="firing"})
        eval_time: 33m
        exp_samples: []
      - expr: count by (alertname, horizontalpodautoscaler) (ALERTS{alertname="KedaHPAScalingInactive",alertstate="firing"})
        eval_time: 40m
        exp_samples:
          - labels: '{alertname="KedaHPAScalingInactive", horizontalpodautoscaler="keda-hpa-gateway"}'
            value: 1

  # 一直是 1：不响；只掉了 3 分钟（短于 for）也不响。
  - name: keda_hpa_active_silent
    interval: 1m
    input_series:
      - series: 'kube_horizontalpodautoscaler_status_condition{namespace="oppenheimer",horizontalpodautoscaler="keda-hpa-gateway",condition="ScalingActive",status="true"}'
        values: '1x30 0x3 1x30'
    promql_expr_test:
      - expr: count by (alertname, horizontalpodautoscaler) (ALERTS{alertname="KedaHPAScalingInactive",alertstate="firing"})
        eval_time: 34m
        exp_samples: []
      - expr: count by (alertname, horizontalpodautoscaler) (ALERTS{alertname="KedaHPAScalingInactive",alertstate="firing"})
        eval_time: 50m
        exp_samples: []

  # 入口到 gateway：每秒 10 个请求，t=10m 起其中 2 个是 5xx（20%）。5 分钟的窗口加 for 5m 之后响；之前不响。
  - name: ingress_gateway_5xx_high
    interval: 30s
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0"}'
        values: '0+300x60'
      - series: 'envoy_cluster_upstream_rq_xx{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",envoy_response_code_class="5"}'
        values: '0x20 0+60x40'
    promql_expr_test:
      - expr: count(ALERTS{alertname="IngressGateway5xxHigh",alertstate="firing"})
        eval_time: 10m
        exp_samples: []
      - expr: count by (severity) (ALERTS{alertname="IngressGateway5xxHigh",alertstate="firing"})
        eval_time: 20m
        exp_samples:
          - labels: '{severity="critical"}'
            value: 1
  # 同样的比例，但流量只有每 5 分钟几个请求：不响。别的路由（prometheus-write）上的 5xx 也不算。
  - name: ingress_gateway_5xx_low_traffic_is_quiet
    interval: 30s
    input_series:
      - series: 'envoy_cluster_upstream_rq_total{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0"}'
        values: '0+1x60'
      - series: 'envoy_cluster_upstream_rq_xx{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",envoy_response_code_class="5"}'
        values: '0+1x60'
      - series: 'envoy_cluster_upstream_rq_total{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/monitoring/prometheus-write/rule/0"}'
        values: '0+300x60'
      - series: 'envoy_cluster_upstream_rq_xx{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/monitoring/prometheus-write/rule/0",envoy_response_code_class="5"}'
        values: '0+300x60'
    promql_expr_test:
      - expr: count(ALERTS{alertname="IngressGateway5xxHigh"})
        eval_time: 20m
        exp_samples: []

  # round-6 7.3 的情形：只有在途上限溢出在涨（排队和连接的溢出都是 0）：t=10m 起每分钟 100 次，15m 在响，signal=active。
  - name: ingress_active_overflow_fires
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_rq_active_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="envoy-a"}'
        values: '0x10 100+100x30'
      - series: 'envoy_cluster_upstream_rq_pending_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="envoy-a"}'
        values: '0x40'
      - series: 'envoy_cluster_upstream_cx_overflow{job="monitoring/ingress-envoy",envoy_cluster_name="httproute/oppenheimer/gateway/rule/0",pod="envoy-a"}'
        values: '0x40'
    promql_expr_test:
      - expr: count by (alertname, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 9m
        exp_samples: []
      - expr: count by (alertname, signal) (ALERTS{alertname="IngressRejectingRequests",alertstate="firing"})
        eval_time: 15m
        exp_samples:
          - labels: '{alertname="IngressRejectingRequests", signal="active"}'
            value: 1
