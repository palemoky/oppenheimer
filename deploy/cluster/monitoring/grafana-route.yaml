# Grafana 挂到 2a 的入口 Gateway 上，和业务入口同一个地址，靠 Host 区分。
# Prometheus 和 Alertmanager 的界面不对外，用 scripts/cluster/monitoring.sh forward。
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: envoy-gateway-system
  hostnames:
    - __GRAFANA_HOST__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kps-grafana
          port: 80
