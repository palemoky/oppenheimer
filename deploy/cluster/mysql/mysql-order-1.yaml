# 订单分片 1（slot 1、3、5、7），一主一从。设计文档 2b 的 3.1。
# 主库偏好 agent-2，和分片 0 的主库错开。
replicas: 2
primaryOrdinal: 0       # 切换后改这里再 helm upgrade（只改 -primary、-replica 两个 Service）
priorityClassName: middleware
serverIdBase: 21          # 和本机 compose 的 21、22 对应
preferredNode: k3s-agent-2
databases:
  - order_db_1
cdc:
  enabled: true
mysqld:
  maxConnections: 200
  innodbBufferPoolSize: 1G
# 2026-11-18 从 1Gi（缓冲池 512M）调上来：灌历史订单时（约 4 万单/秒，没有限速）主库被 OOMKilled，
# 另外三个实例也到了 990 Mi 以上。缓冲池之外的开销（连接、大事务的 binlog 缓存、performance_schema）
# 在大批量写入时有 500 Mi 上下，是个绝对量，不随缓冲池按比例走。设计文档 3b 第 6 节。
# 同一天又从 2Gi 提到 2560Mi：灌完 1000 万单后匿名内存 1844 MB（缓冲池 1047、固定开销约 400、分配器留着的约 400），贴着 2Gi。
resources:
  memory: 2560Mi
  cpu: 250m
storage:
  size: 20Gi
backup:
  enabled: true
  schedule: "30 19 * * *"   # UTC，北京时间 03:30；三个实例错开
