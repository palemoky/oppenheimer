# release 名 redis-cache，命名空间 redis。查询缓存和 gateway 限流的桶。
priorityClassName: middleware
replicas: 6
replicasPerMaster: 1
maxmemory: 128mb
maxmemoryPolicy: allkeys-lru
storage: 1Gi
resources:
  # CPU 按实测定（2026-11-22，3b 的记录 round-8-cpu-requests.md 第 5 节；算法和为什么乘 0.9 见 deploy/cluster/services/gateway.yaml）：
  # 混合读写 1526 请求/秒时每个主库用 0.12 到 0.13 核。redis-gate 的 100m 对实测的 0.125 核已经在这个比例上，没有动。
  requests: {cpu: 100m, memory: 192Mi}
  limits: {memory: 192Mi}
