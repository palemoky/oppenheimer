# 对外入口。模板：__LB_GATEWAY_IP__ 由 scripts/cluster/addons.sh 从 cluster.env 填入。
# 设计见 docs/design/2a-cluster.md 第 7 节、ADR-0025。
#
# EnvoyProxy：定制 Envoy Gateway 为 Gateway 创建的数据面（一个 Envoy 的 Deployment 和一个 Service）。
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # 2 个副本，分在不同的节点上：入口是所有外部流量的必经之路，一个节点挂了不能跟着没。
        # 流量不是在两个副本之间分摊的：MetalLB 的二层模式下入口的地址同一时刻只由一个节点应答 ARP，
        # 加上下面的 externalTrafficPolicy: Local，流量全部落在那个节点上的那一个 Envoy。另一个是备用的：
        # 持有地址的节点挂了，MetalLB 让另一个有就绪 Envoy 的节点接管地址（免费 ARP），这是故障切换。
        replicas: 2
        pod:
          # 用分布约束而不是“必须不同节点”的反亲和：滚动更新时多出来的那个 Pod 可以落到第三个节点，
          # 不会因为两个节点都已经各有一个而卡住。
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
                  gateway.envoyproxy.io/owning-gateway-name: public
        container:
          resources:
            # CPU 按实测定（2026-11-22，3b 的记录 round-8-cpu-requests.md 第 5 节；算法和为什么乘 0.9 见 deploy/cluster/services/gateway.yaml）：
            # 混合读写 1526 请求/秒时接流量的那个 Pod 用 0.73 到 0.74 核（MetalLB 是二层模式，两个 Pod 里只有一个在接）。
            # 原来的 100m 在节点满的时候只保证得了它用量的几分之一，过载时在途请求会在入口堆到上限。
            requests: { cpu: 700m, memory: 128Mi }
            limits: { memory: 512Mi }
      # 排空节点时一次最多带走一个 Envoy。
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        type: LoadBalancer
        # Local：只转给本节点上的 Envoy，不改源地址，Envoy 看到的是真实的客户端地址（gateway 的按 IP
        # 限流要用）。代价是 MetalLB 只让有就绪的 Envoy 的节点持有这个地址。
        externalTrafficPolicy: Local
        annotations:
          metallb.io/loadBalancerIPs: "__LB_GATEWAY_IP__"
  # 访问日志只留出问题的请求（设计文档 3a 第 8 节“第 8 步的前一半”）。默认是每个请求一行：
  # 那一行和 gateway 自己记的访问日志内容重复，却占了 Loki 里全部日志的 60%，压测时一小时一个多 GB。
  # 留下的两类正好是 gateway 的日志里没有的：
  #   - 5xx：包括根本没有到达 gateway 的（没有健康的上游、连接失败），这种请求只有入口知道
  #   - 带 response flags 的：Envoy 自己判定出了状况（NR 没有匹配的路由、UF 上游连接失败、DC 客户端中途断开……）
  # “或”要写在一条表达式里：CRD 的文档说多条 matches 满足一条就记，但 Envoy Gateway v1.10.0 实际生成的是
  # and_filter（看过 Envoy 的 config_dump），分成两条写的话 404 加 NR 这种就不记了（2026-11-17 实测）。
  # 写错的 CEL 表达式会被悄悄忽略（等于没有这条），改了之后要实测：
  # 发一个正常请求确认不记，发一个 Host 不存在的请求（404、NR）确认记了。
  # 正常请求的量和延迟看指标，单个请求看链路，都不靠这份日志。
  telemetry:
    accessLog:
      settings:
        - matches:
            - "response.code >= 500 || response.flags != 0"
          sinks:
            - type: File
              file:
                path: /dev/stdout
---
# GatewayClass：这一类入口由哪个控制器实现，用哪份参数。
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: public
    namespace: envoy-gateway-system
---
# Gateway：要一个入口，监听 80。Envoy Gateway 看到它才创建 Envoy。443 在 2d 有了证书之后加。
# 路由（HTTPRoute）由各个服务在自己的命名空间里声明，所以允许所有命名空间挂上来。
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
