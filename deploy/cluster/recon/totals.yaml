# 钱的笔数和金额核对（recon watch-totals）：常驻的一个 Pod，每 30 秒按笔数和金额核对一次最近 30 分钟的支付，
# 结果报成指标（recon.totals.*），有差异时每一轮打一条 Error 日志。规则在 services/recon/internal/totals 的包注释里，
# 设计文档 3c 第 8 节“钱的笔数和金额”。由 scripts/cluster/services.sh recon-totals 把 __IMAGE__、__IMAGE_TAG__ 填上后 apply。
#
# 和同目录的 cronjob.yaml 的分工：这个回答“钱现在对不对得上”，几十秒一轮，只知道是哪一分钟、差几笔、差多少钱；
# CronJob 的逐行对账每小时一轮，定位到具体是哪一笔。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recon-totals
  labels:
    app.kubernetes.io/name: recon-totals
    app.kubernetes.io/part-of: oppenheimer
spec:
  # 一个就够：它只读，两个副本会各报各的一份同样的数，告警里还得去重。
  replicas: 1
  # 先停后起：同上，不让新旧两个同时报。停的那十几秒没有数据，告警的 for 盖得住。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: recon-totals
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recon-totals
        app.kubernetes.io/part-of: oppenheimer
      annotations:
        # 不进网格：只连 MySQL 和 Collector，两者都不经边车（和业务服务的出站排除一致）。
        sidecar.istio.io/inject: "false"
    spec:
      # 收到 SIGTERM 之后只是停下循环、把最后一批指标推出去（otelx 关闭最多 5 秒）。
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          # 软性地放在控制面节点上，和 Prometheus、探针一样：阶段 4 要关的是工作节点，
          # 而“钱对不对得上”正是关节点的实验里最想一直看着的数。
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: Exists}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recon-totals
          image: "__IMAGE__"
          imagePullPolicy: IfNotPresent
          # 镜像的 ENTRYPOINT 是 recon，这里只给子命令。参数都用默认值：
          #   -interval 30s        两轮之间的间隔
          #   -window 30m          往回看多久。支付时限是 15 分钟，一笔支付从创建到订单答复不会超过它太多；
          #                        滑出窗口之后由每小时的逐行对账负责
          #   -skip 1m             最新的一分钟不看（支付单号是各实例按自己的时钟分配的）
          #   -query-timeout 10s   一轮的时限
          args: ["watch-totals"]
          env:
            # 密码来自 Secret oppenheimer-mysql（app 账号，和 cronjob.yaml 一样）。$(VAR) 由 Kubernetes 展开，密码的变量写在前面。
            - {name: MYSQL_ORDER_0_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: order-0-app-password}}}
            - {name: MYSQL_ORDER_1_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: order-1-app-password}}}
            - {name: MYSQL_MAIN_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: main-app-password}}}
            # 订单库读主库，不读从库：从库有复制延迟，会把“还没复制到”读成“订单一侧少了”。
            # 每一轮在每个库上只有一条按主键范围的聚合。
            - {name: MYSQL_DSNS, value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-primary.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-primary.mysql.svc:3306)/order_db_1"}
            - {name: PAYMENT_DSN, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/payment_db"}
            # 指标推给 Collector，和六个服务一样；资源属性里带上命名空间、Pod、节点（Prometheus 把它们提成了标签）。
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-gateway.monitoring:4317"}
            - {name: POD_NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.version=__IMAGE_TAG__,k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME)"}
          resources:
            # 估的，上线后按实测改：它每 30 秒做三条小查询，其余时间在睡。
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # 没有就绪和存活探针：它不接收请求；卡住了的表现是 recon.totals.runs 不再增长，由告警报出来。
