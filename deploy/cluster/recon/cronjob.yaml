# 对账 CronJob：对着长期运行的那一套（命名空间 oppenheimer）定时跑 recon，有差异时 Job 失败，Prometheus 按 Job 的失败报警
# （设计文档 3c 的 3.7 节）。由 scripts/cluster/services.sh recon-cron 把 __IMAGE__ 换成当前部署的 recon 镜像后 apply，
# 可重复执行；正式压测前后用 recon-cron-suspend、recon-cron-resume 暂停和恢复。
#
# 两个 CronJob 的分工：
#   recon-hourly  每小时比最近的，差异发现得快；
#   recon-daily   每天全量比一遍（不带 -since），盖住每小时那次看不到的：订单创建很久之后才出现的差异。
#                 2026-11-22 量过，1473.7 万单四对 1 分 55 秒（设计文档 3c 第 8 节），所以每天全量是便宜的；
#                 耗时随总量线性增长，告警里要盯它的耗时，接近时限时再换成按场景的对账（阶段计划的 3e）。
# 两者共用的设置（理由写在这里一遍，下面各自只写不同的）：
#   -pairs payment,stock,replica,index   订单对支付单、对库存预占、对从库、对商家索引。不含 archive：
#                                        它要显式给一份存下来的树（-snapshot-out、-against），不是定时对账的形态。
#   不写 -settle（用 recon 自己的默认 30 分钟）：系统在运行，只比 30 分钟之前创建的订单（支付时限 15 分钟的两倍），
#                                        在途的订单不算差异。loadtest.sh recon 的 -settle 0 是压完静止之后才用的，这里不能抄。
#   -recheck 30s                         发现差异后隔 30 秒重读再比，只有还在的才算确认。默认 5 秒；这里要盖住从库的复制延迟
#                                        和 outbox、消费者的处理延迟（压测中是秒级），30 秒与 loadtest.sh recon 的取值一致。
#                                        代价只是出现差异时多等 30 秒。
#   ARCHIVE_DSN                          只有 recon-daily 设。每小时那次的窗口只有 2 小时，里面的订单不会被归档
#                                        （归档只动旧的终态订单），不用读冷库；全量的要读，否则已归档订单的支付单、
#                                        预占、索引在订单一侧找不到对应的行，全部报成差异。
#   不加 -repair                         对账只报告。索引的自动修复会把差异盖住，Job 就不会失败，告警也就没有了。
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recon-hourly
  labels:
    app.kubernetes.io/name: recon
    app.kubernetes.io/part-of: oppenheimer
spec:
  # 每小时第 7 分钟：避开整点（各种定时任务和 k6 的常用时刻）。
  # -since 2h 加默认的 -settle 30m：窗口是 [现在-2 小时, 现在-30 分钟)，90 分钟宽，一小时一跑，
  # 相邻两次重叠 30 分钟，没有缝；重叠的那段让上一次因为还在途中才没比上的订单再比一遍。
  schedule: "7 * * * *"
  # 写明 UTC：不依赖控制器所在机器的时区。
  timeZone: UTC
  # Forbid：上一次没跑完就跳过这一次，不并行。两个对账同时读四个 MySQL 实例，只会互相拖慢。
  # 错过计划时间超过 10 分钟就放弃这一次（控制器重启、调度不上时）：再晚就等下一个小时，别和下一次挤在一起。
  startingDeadlineSeconds: 600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # 失败的多留几个：差异的明细在 Job 的日志里（也进了 Loki），告警响了要能回头看，连着失败几次也都看得到。
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: recon
        app.kubernetes.io/part-of: oppenheimer
    spec:
      # 不重试：退出码 1 是“有确认的差异”，重跑一次也许就“好了”（在途的状态变了），那样失败被盖住，告警不响。
      # 运行出错（退出码 2，比如连不上库）也不重试，下一个周期再来；告警按 Job 失败报，由人看日志分是哪一种。
      backoffLimit: 0
      # Job 的总时限，是兜底：recon 自己的 -timeout（25m）先到，它会干净地退出并打日志；
      # 这个在它卡死、没有响应 -timeout 的时候强杀。
      # 半小时：正常几十秒到几分钟（3b 在大库上量过，窗口 8.9 万行的一对第一遍 9 秒），余量很大；
      # 超过半小时说明库出了问题，不拖到下一次。-timeout 25m 比它短 5 分钟，给 recon 留出打日志退出的时间。
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recon
            app.kubernetes.io/part-of: oppenheimer
          annotations:
            # 不进网格：recon 只连 MySQL，不调任何服务。（命名空间没有打注入标签，Pod 默认也不注入，
            # 这里写明，免得以后改成全命名空间注入时它被带进去、白占一个边车。）
            sidecar.istio.io/inject: "false"
        spec:
          # Job 的 backoffLimit 是 0，Pod 也不原地重启；失败的 Pod 留着看日志。
          restartPolicy: Never
          # 不碰 Kubernetes 的 API，不挂令牌。
          automountServiceAccountToken: false
          affinity:
            nodeAffinity:
              # 软的：尽量不放控制面节点（业务 Pod 都不上它），但其他节点都满了时宁可放上去也不要让对账排不上。
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recon
              image: "__IMAGE__"
              imagePullPolicy: IfNotPresent
              # 镜像的 ENTRYPOINT 是 /app/entrypoint（指向 recon），这里只给参数。distroless 没有 shell。
              args:
                - -pairs=payment,stock,replica,index
                - -since=2h
                - -recheck=30s
                - -timeout=25m
              env:
                # 密码来自 Secret oppenheimer-mysql（services.sh deploy 从 mysql 命名空间复制来的，app 账号）。
                # 下面 DSN 里的 $(VAR) 是 Kubernetes 在 Pod 里展开的，所以密码的变量要写在它们前面。
                - {name: MYSQL_ORDER_0_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: order-0-app-password}}}
                - {name: MYSQL_ORDER_1_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: order-1-app-password}}}
                - {name: MYSQL_MAIN_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: main-app-password}}}
                # 库名是平时（不是空表对照）的正式库，没有 e2e_ 前缀，和 scripts/cluster/loadtest.sh 的 DB_PREFIX 为空时一致。
                # 空表对照期间 order 指到 e2e_* 库，这套对着的就不是在服务的库了，那段时间先 recon-cron-suspend。
                - {name: MYSQL_DSNS, value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-primary.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-primary.mysql.svc:3306)/order_db_1"}
                - {name: MYSQL_REPLICA_DSNS, value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-replica.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-replica.mysql.svc:3306)/order_db_1"}
                - {name: MERCHANT_INDEX_DSNS, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/merchant_index_db_0,app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/merchant_index_db_1"}
                - {name: PAYMENT_DSN, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/payment_db"}
                - {name: INVENTORY_DSN, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/inventory_db"}
              resources:
                # CPU 的 requests 只给 100m：它是后台任务，节点的 requests 已经很满；不设 CPU limit，免得被限流拖长。
                # 内存的 limit 和 loadtest.sh 一次性 Pod 的默认值一致（1Gi）：树的摘要和差异节点的行放在内存里，
                # --max-rows 限住了每个节点的行数。
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recon-daily
  labels:
    app.kubernetes.io/name: recon
    app.kubernetes.io/part-of: oppenheimer
spec:
  # 每天 UTC 21:30：在 MySQL 备份（19:00、19:30、20:00 起）之后，不和备份抢从库的读。
  # 不带 -since，只有默认的 -settle 30m：比的是 30 分钟之前创建的全部订单，包括已归档的。
  # 比每小时那次多看的是创建时间在 2 小时以前的订单，用来发现订单创建很久之后才出现的差异。
  schedule: "30 21 * * *"
  # 写明 UTC：不依赖控制器所在机器的时区。
  timeZone: UTC
  # Forbid：上一次没跑完就跳过这一次，不并行。两个对账同时读四个 MySQL 实例，只会互相拖慢。
  # 错过计划时间超过一小时就放弃这一次：一天一次的，晚一点跑比不跑好，但别拖到第二天。
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # 失败的多留几个：差异的明细在 Job 的日志里（也进了 Loki），告警响了要能回头看，连着失败几次也都看得到。
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: recon
        app.kubernetes.io/part-of: oppenheimer
    spec:
      # 不重试：退出码 1 是“有确认的差异”，重跑一次也许就“好了”（在途的状态变了），那样失败被盖住，告警不响。
      # 运行出错（退出码 2，比如连不上库）也不重试，下一个周期再来；告警按 Job 失败报，由人看日志分是哪一种。
      backoffLimit: 0
      # Job 的总时限，是兜底：recon 自己的 -timeout（55m）先到，它会干净地退出并打日志；
      # 这个在它卡死、没有响应 -timeout 的时候强杀。
      # 一小时：全量，现在约 2 分钟（1473.7 万单），线性外推到 1 亿单约 13 分钟，余量还很大；
      # 超过一小时说明有问题，也不会拖到下一次。
      # -timeout 55m 比它短 5 分钟，给 recon 留出打日志退出的时间。
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recon
            app.kubernetes.io/part-of: oppenheimer
          annotations:
            # 不进网格：recon 只连 MySQL，不调任何服务。（命名空间没有打注入标签，Pod 默认也不注入，
            # 这里写明，免得以后改成全命名空间注入时它被带进去、白占一个边车。）
            sidecar.istio.io/inject: "false"
        spec:
          # Job 的 backoffLimit 是 0，Pod 也不原地重启；失败的 Pod 留着看日志。
          restartPolicy: Never
          # 不碰 Kubernetes 的 API，不挂令牌。
          automountServiceAccountToken: false
          affinity:
            nodeAffinity:
              # 软的：尽量不放控制面节点（业务 Pod 都不上它），但其他节点都满了时宁可放上去也不要让对账排不上。
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recon
              image: "__IMAGE__"
              imagePullPolicy: IfNotPresent
              # 镜像的 ENTRYPOINT 是 /app/entrypoint（指向 recon），这里只给参数。distroless 没有 shell。
              args:
                - -pairs=payment,stock,replica,index
                - -recheck=30s
                - -timeout=55m
              env:
                # 密码来自 Secret oppenheimer-mysql（services.sh deploy 从 mysql 命名空间复制来的，app 账号）。
                # 下面 DSN 里的 $(VAR) 是 Kubernetes 在 Pod 里展开的，所以密码的变量要写在它们前面。
                - {name: MYSQL_ORDER_0_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: order-0-app-password}}}
                - {name: MYSQL_ORDER_1_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: order-1-app-password}}}
                - {name: MYSQL_MAIN_PASSWORD, valueFrom: {secretKeyRef: {name: oppenheimer-mysql, key: main-app-password}}}
                # 库名是平时（不是空表对照）的正式库，没有 e2e_ 前缀，和 scripts/cluster/loadtest.sh 的 DB_PREFIX 为空时一致。
                # 空表对照期间 order 指到 e2e_* 库，这套对着的就不是在服务的库了，那段时间先 recon-cron-suspend。
                - {name: MYSQL_DSNS, value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-primary.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-primary.mysql.svc:3306)/order_db_1"}
                - {name: MYSQL_REPLICA_DSNS, value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-replica.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-replica.mysql.svc:3306)/order_db_1"}
                - {name: MERCHANT_INDEX_DSNS, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/merchant_index_db_0,app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/merchant_index_db_1"}
                # 冷库：全量对账的订单一侧要包含已归档的订单（见文件开头）。
                - {name: ARCHIVE_DSN, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/order_archive_db"}
                - {name: PAYMENT_DSN, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/payment_db"}
                - {name: INVENTORY_DSN, value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/inventory_db"}
              resources:
                # CPU 的 requests 只给 100m：它是后台任务，节点的 requests 已经很满；不设 CPU limit，免得被限流拖长。
                # 内存的 limit 和 loadtest.sh 一次性 Pod 的默认值一致（1Gi）：树的摘要和差异节点的行放在内存里，
                # --max-rows 限住了每个节点的行数。
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
