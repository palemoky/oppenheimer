# inventory 服务（设计文档 2c）。release 名 inventory，命名空间 oppenheimer。
# 镜像的仓库和 tag 由 scripts/cluster/services.sh 传入。没有 gRPC 下游，只有入站（9082）过边车。
replicas: 2
ports: {http: 8082, grpc: 9082}
# CPU requests 按实测定（2026-11-22，算法和为什么乘 0.9 见 gateway.yaml）：2 个副本、混合读写 1526 请求/秒时每个 Pod
# 业务容器 0.47 到 0.52 核、边车 0.29 到 0.30 核。
resources: {cpu: 450m, memoryRequestMi: 64, memoryLimitMi: 512}
istio:
  proxy: {cpu: 250m, memory: 64Mi, memoryLimit: 192Mi}   # 三项要一起写，原因见 gateway.yaml

config:
  KAFKA_BROKERS: kafka-kafka-bootstrap.kafka.svc:9092
  REDIS_ADDR: sentinel://gate@redis-gate-sentinel.redis.svc:26379
  CACHE_REDIS_ADDR: cluster://redis-cache.redis.svc:6379

# inventory 的库在共享实例 mysql-main 上，用 app 账号。
secretEnv:
  - {name: MYSQL_MAIN_PASSWORD, key: main-app-password}
expandEnv:
  - name: MYSQL_DSN
    value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/inventory_db"
