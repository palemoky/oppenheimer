# gateway 服务（设计文档 2c）。release 名 gateway。
# gateway 的 HTTP 入站不经过边车（入口的 Envoy 直接连 8080）。没有 gRPC 入站，但四个出站要过边车，所以照样注入
# （istio.inject 默认 true）；入站一个端口都不接管（chart 按 ports.grpc 为 0 处理）。
# 管理端口（降级开关，ADMIN_ADDR 的默认值 127.0.0.1:8089）不设：它没有鉴权，只在 Pod 内的回环上监听，
# 用 kubectl port-forward 访问。探针打的是对外的 8080（/healthz、/readyz 在对外端口的 mux 上）。
replicas: 2
ports: {http: 8080, grpc: 0}
resources: {cpu: 200m, memoryRequestMi: 64, memoryLimitMi: 512}

config:
  # 下游连 Service 名加 gRPC 端口：出站被自己的边车截获，按 deploy/cluster/mesh/ 的规则路由、限流、摘除。
  ORDER_ADDR: order:9081
  INVENTORY_ADDR: inventory:9082
  PAYMENT_ADDR: payment:9083
  ORDERINDEX_ADDR: orderindex:9084
  RATE_LIMIT_REDIS_ADDR: cluster://redis-cache.redis.svc:6379
  # 入口的 Envoy 会在 X-Forwarded-For 里追加客户端地址。入口 Pod 的地址不固定，先信整个 Pod 网段；
  # 任何 Pod 都能伪造这个头的问题留给 2d 的 NetworkPolicy（设计文档 7.5）。
  TRUSTED_PROXIES: 10.42.0.0/16

route:
  enabled: true
  hostnames: [api.oppenheimer.test]
  parentRef: {name: public, namespace: envoy-gateway-system}
  # 入口到 gateway 的连接上限（3b 第 3 轮的记录；2026-11-22 按扩容系数那一轮的记录第 4.1 节改过）。
  # 第 3 轮定 1024 时的算法是“入口到 gateway 是 HTTP/1.1，在途请求数就是连接数”。这个等式不成立：
  # maxConnections 数的是所有连接，闲着的也算；入口的连接池按“工作线程 × gateway 的 Pod”分开，互相借不到。
  # 4 个 gateway 副本、1526 请求/秒时在途只有 82 个请求，连接已经占满 1024 条，再往上入口就答 503（UO）：
  # 副本越多入口能接的越少，和扩容的目的相反。
  # 并发上限交给 maxParallelRequests（数的是在途请求）：1024，第 3 轮的算法原样适用——在途请求数 = 到达速率 × 平均耗时，
  # 正常时几十个，到 1024 相当于平均耗时到了半秒，这时让入口拒绝一部分比让所有请求一起更慢要好。
  # maxConnections 4096：只要不先于 maxParallelRequests 触发就行。改完之后量到的连接数是在途请求数的三到六倍
  # （4 个副本：在途 81 个时 466 条，547 个时 1512 条，1024 个时 3716 条），4096 刚好盖住；gateway 的副本数或入口的
  # 线程数再涨，这个数要跟着重算。
  # connectionIdleTimeout 30 秒：闲连接半分钟关掉，连接数跟着在途请求数走，不跟着“历史上的峰值 × 池子个数”走。
  # 它要短于 gateway 自己关闭空闲连接的时间（gateway 不主动关，见 chart 模板里的说明）。
  # 排队的 1024 不收紧：连接池是冷的时候（突发流量的头一批请求）每个请求都要先排队等连接建好，
  # 收得太紧会在最需要接住的时候拒绝请求。
  circuitBreaker: {maxParallelRequests: 1024, maxConnections: 4096, maxPendingRequests: 1024, connectionIdleTimeout: 30s}

# 按请求速率伸缩，2 到 3 个副本，CPU 兜底（设计文档 3a 的 3.8）。上面的 replicas 不再起作用。
# 上限从 4 收到 3（2026-11-22，3b 扩容系数那一轮的记录第 5 节）：这两个节点上加副本不加能力，4 个副本的拐点
# 比 2 个还低一档、同样的请求量多用一成 CPU。2 个副本的理由是可用性；留 3 是为了伸缩的机制还在、能验证
# “扩容时不丢请求”。加了节点之后这个数要重定。
# 查询数的是 gateway 自己记的 HTTP 请求（SDK 的指标，不含探针）；窗口 1 分钟：指标每 15 秒导出一次，
# 窗口太短速率会跳，太长扩容就慢。
# perReplica 的来历（设计文档第 8 节“第 7 步”）：探针的请求组合下每个请求每秒约 0.92 毫核（服务加边车），
# 每个 Pod 的 CPU requests 是 250m，70% 对应 190 请求/秒；取 180，让请求速率比 CPU 早一步触发。3b 压测后重定。
autoscaling:
  enabled: true
  maxReplicas: 3
  requestRate:
    query: sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name="oppenheimer",service_name="gateway"}[1m]))
    perReplica: 180
