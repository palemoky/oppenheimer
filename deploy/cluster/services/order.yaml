# order 服务（设计文档 2c）。release 名 order。
replicas: 2   # 节点号各自从库里租（ADR-0028）
ports: {http: 8081, grpc: 9081}
resources: {cpu: 300m, memoryRequestMi: 96, memoryLimitMi: 768}

config:
  KAFKA_BROKERS: kafka-kafka-bootstrap.kafka.svc:9092
  REDIS_ADDR: sentinel://gate@redis-gate-sentinel.redis.svc:26379
  CACHE_REDIS_ADDR: cluster://redis-cache.redis.svc:6379
  # 连 Service 名加 gRPC 端口，出站被自己的边车截获（规则在 deploy/cluster/mesh/inventory.yaml）。
  INVENTORY_ADDR: inventory:9082

# 两个订单分片各有主库和从库（MYSQL_REPLICA_DSNS 的个数和顺序与 MYSQL_DSNS 一一对应）；冷库在共享实例上。
secretEnv:
  - {name: MYSQL_ORDER_0_PASSWORD, key: order-0-app-password}
  - {name: MYSQL_ORDER_1_PASSWORD, key: order-1-app-password}
  - {name: MYSQL_MAIN_PASSWORD, key: main-app-password}
expandEnv:
  - name: MYSQL_DSNS
    value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-primary.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-primary.mysql.svc:3306)/order_db_1"
  - name: MYSQL_REPLICA_DSNS
    value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-replica.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-replica.mysql.svc:3306)/order_db_1"
  - name: ARCHIVE_DSN
    value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/order_archive_db"
  # 不设 WORKER_ID：节点号启动时从自己的库里租（ADR-0028），每个副本各一个。

# 按请求速率伸缩，2 到 4 个副本，CPU 兜底（设计文档 3a 的 3.8）。上面的 replicas 不再起作用。
# 查询数的是 order 收到的 gRPC 请求（受理和查询）。它不包含消费 Kafka 落库的那一半工作：
# 落库的量跟着受理走，但落库卡在下游时请求速率和 CPU 都不涨，那种情况要按消费延迟伸缩（KEDA 的 kafka 触发器），没有做。
# perReplica 的来历（设计文档第 8 节“第 7 步”）：探针的请求组合（查询和下单约 4 比 1）下每个请求每秒约 2.3 毫核
#（服务加边车，含落库），每个 Pod 的 CPU requests 是 350m，70% 对应 108 请求/秒；取 100。下单的占比变了这个数就不准，3b 压测后重定。
autoscaling:
  enabled: true
  requestRate:
    query: sum(rate(rpc_server_call_duration_seconds_count{k8s_namespace_name="oppenheimer",service_name="order"}[1m]))
    perReplica: 100
