# order 服务（设计文档 2c）。release 名 order。
replicas: 2   # 节点号各自从库里租（ADR-0028）
ports: {http: 8081, grpc: 9081}
# CPU requests 按实测定（2026-11-22，算法、三个用处、为什么乘 0.9 见 gateway.yaml）：2 个副本、混合读写 1526 请求/秒时每个 Pod
# 业务容器 0.75 到 0.78 核、边车 0.28 到 0.29 核。普通下单 100 单/秒（写入拐点的八成）时是 0.54 加 0.17，比它低。
resources: {cpu: 700m, memoryRequestMi: 96, memoryLimitMi: 768}
istio:
  proxy: {cpu: 250m, memory: 64Mi, memoryLimit: 192Mi}   # 三项要一起写，原因见 gateway.yaml

config:
  KAFKA_BROKERS: kafka-kafka-bootstrap.kafka.svc:9092
  REDIS_ADDR: sentinel://gate@redis-gate-sentinel.redis.svc:26379
  CACHE_REDIS_ADDR: cluster://redis-cache.redis.svc:6379
  # 连 Service 名加 gRPC 端口，出站被自己的边车截获（规则在 deploy/cluster/mesh/inventory.yaml）。
  INVENTORY_ADDR: inventory:9082
  # 3b 第 2 轮之前的对照（2026-11-20）：落库的并发从每分区 8 提到 24，连接池跟着从每库 25 提到 50
  # （两个副本合计每个分片 100 个连接，MySQL 的上限是 200）。结果见 docs/notes/3b-rounds/。
  SUBMIT_CONCURRENCY: "24"
  # 连接池从 50 收到 40（2026-11-22，3b 扩容系数那一轮的记录第 4.3 节）。每个订单库的 max_connections 是 200，
  # 连到它的 order 的 Pod 数最多是“HPA 的上限 + 滚动时多出来的 1 个”。定这个数时上限是 3：4 × 40 = 160，
  # 剩下 40 给复制、CDC、监控、对账工具和人。原来的 50 在 HPA 上限是 4 时合计正好 200，一点余量没有。
  # 同一天上限又收到 2（见下面的 autoscaling），按公式 50 也放得下了；没有改回去：40 在 2 个副本上压测过够用
  #（round-7-read-modes.md 第 4 节），上限再回到 3 时不用跟着动。
  # HPA 的上限（下面的 autoscaling.maxReplicas）或 max_connections（deploy/cluster/mysql/mysql-order-*.yaml）变了，
  # 这个数要跟着重算：(maxReplicas + 1) × 连接池 ≤ max_connections − 40。
  # 代价：启动时 checkSubmitConcurrency 会警告（24 × 4 个分区 = 96，大于 40 × 2 个库 = 80）。它说的是
  # “一个副本独占全部分区时落库会在连接池上排队”，只在另一个副本不在时成立；两个副本各拿两个分区时
  # 每个库的在途落库是 24 个上下，加读名额 16 个，正好贴着 40。压测时看连接池的等待指标。
  MYSQL_MAX_OPEN_CONNS: "40"
  # 受理端背压的队列上限（ADR-0011）要取“落库速率 × 允许的等待”。代码里的默认值 10000 是按本机每秒落 400 单以上定的；
  # 这套环境过载时只落 100 到 215 单/秒（3b 第 1、2 轮），1 万单要排 50 到 100 秒，贴着甚至超过回收的宽限期（60 秒）：
  # 第 1 轮有 608 个受理了的订单等不到落库被回收，第 2 轮落库延迟的 p99 是 55 秒。
  # 2500 = 125 单/秒（持续能落的速率）× 20 秒。按量到的最慢和最快的落库速率，最后一个被受理的订单要等 12 到 25 秒，
  # 都短于 ADMIT_MAX_WAIT（30 秒）和宽限期。落库速率变了（换盘、加分片）这个数要跟着重算。
  #
  # 2026-11-23 从 2500 改成 1250。上面“队列长度 ÷ 总的落库速率”算的是平均的等待，不是最长的：
  # 这个上限数的是所有分区合在一起的占用，而落库是 4 个分区各落各的（各约 44 单/秒）。背压把受理的总速率压到
  # 等于落库的总速率之后，每个分区自己的进和出是相等的，没有东西把它的队列拉回平均值，最坏的情况是队列几乎都
  # 排在一个分区里：2500 ÷ 44 ≈ 57 秒。压测 280 单/秒 25 分钟量到的落库延迟 p99 正是 55 到 57 秒（按总速率算是
  # 13 秒），离宽限期 60 秒差 3 秒；两个 order Pod 上的 p99 一个 58 秒、一个 20 秒（设计文档 3c 第 8 节
  # “第 14 项的追查”第 3 条）。所以这个数要按“允许的等待 × 单个分区的落库速率”取：30 秒 × 44 ≈ 1320，取 1250，
  # 最坏约 28 秒。代价：过载时受理的速率本来就等于落库的速率，吞吐不变；能吸收的突发从约 13 秒的量变成约 7 秒的量，
  # 短于这个时长的突发里会多出一些 429。
  # 没有解决的：分区里面落库还按 key 分成 24 条 lane，各自串行，lane 之间同样会不均；背压的第 2 条
  # （排队超过 30 秒的多于 ADMIT_MAX_STALE 个就拒绝）限制的是个数不是时长，100 个超时的占用可以集中在一两条
  # lane 上。这个数改完之后没有重新压测过，下一次打过拐点的压测看落库延迟的 p99 是不是在 30 秒以内。
  #
  # 2026-11-23 晚些时候：这个数现在是**每个分区**的上限，不再是全部占用的上限（ADR-0036）。order 受理时算出订单的
  # 落库消息会进 order.submit 的哪个分区，闸门按分区各数各的（启动日志里有一行 “admission backlog is counted per
  # landing partition” 报分区数）。数没有变，含义变了：每个分区最多排 1250 单，按每个分区每秒落 44 单是约 28 秒；
  # 一个分区满了只拒绝会排进它的订单。能吸收的突发从约 7 秒的量回到“4 个分区 × 1250”，约 27 秒的量。
  # 分区数或者单个分区的落库速率变了要重算。没有在过载下验证过。
  ADMIT_MAX_QUEUE: "1250"
  # 背压的第 2 条：排队超过 ADMIT_MAX_WAIT（30 秒）的占用多于这个数就拒绝。代码里的默认值是 100。
  # 它限制的是个数，不是最老的那个排了多久：落库是 96 条各自串行的 lane（4 个分区 × SUBMIT_CONCURRENCY 24），
  # 过载时一条 lane 每秒落约 1.9 单，100 个超时的占用集中在两条 lane 上就是再等 26 秒（30 + 26 = 56 秒，
  # 正是压测里量到的落库延迟 p99）。20 个时最坏是一条 lane 上再等约 10 秒，离宽限期 60 秒有 20 秒的余量。
  # 下限是“要容得下零星的孤儿”（受理了但消息没发出去的占用，要等宽限期才被回收）：只有 order 的实例在受理的
  # 中途崩溃才会产生，一次是那一刻在途的几个请求，20 个容得下。
  # 这个数同时是落库没有动静时放进去的探测订单数（背压的第 3 条），从 100 变成 20：消费者停住时每个宽限期
  # 最多损失的订单也从 101 个变成 21 个。没有在过载下验证过。见 ADR-0035、设计文档 3c 第 8 节。
  # 同样从 2026-11-23 起按分区数：每个分区里排队超时的多于 20 个，就拒绝会排进这个分区的订单。
  # 第 3 条（落库整个没有动静）不分分区，仍然拿全部占用的个数和这个数比。
  ADMIT_MAX_STALE: "20"
  # 延迟关单的消费者在一个分区里同时处理几条到期的消息（队首到期之后按订单号并发，ADR-0036）。
  # 4 是代码里的默认值，写在这里是为了和上面几个数放在一起看：8 个分区 × 4 = 32 张同时在关，
  # 一个副本拿 4 个分区时最多多占 16 条订单库的连接（关单的事务很短），连接池是上面的 40。
  CLOSE_CONCURRENCY: "4"

# 两个订单分片各有主库和从库（MYSQL_REPLICA_DSNS 的个数和顺序与 MYSQL_DSNS 一一对应）；冷库在共享实例上。
secretEnv:
  - {name: MYSQL_ORDER_0_PASSWORD, key: order-0-app-password}
  - {name: MYSQL_ORDER_1_PASSWORD, key: order-1-app-password}
  - {name: MYSQL_MAIN_PASSWORD, key: main-app-password}
expandEnv:
  - name: MYSQL_DSNS
    value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-primary.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-primary.mysql.svc:3306)/order_db_1"
  - name: MYSQL_REPLICA_DSNS
    value: "app:$(MYSQL_ORDER_0_PASSWORD)@tcp(mysql-order-0-replica.mysql.svc:3306)/order_db_0,app:$(MYSQL_ORDER_1_PASSWORD)@tcp(mysql-order-1-replica.mysql.svc:3306)/order_db_1"
  - name: ARCHIVE_DSN
    value: "app:$(MYSQL_MAIN_PASSWORD)@tcp(mysql-main-primary.mysql.svc:3306)/order_archive_db"
  # 不设 WORKER_ID：节点号启动时从自己的库里租（ADR-0028），每个副本各一个。

# 按请求速率伸缩，CPU 兜底（设计文档 3a 的 3.8）。上面的 replicas 不再起作用。
# 上限 2，和下限相同（2026-11-22，从 4 到 3 再到 2），来历同 gateway.yaml；它还决定上面连接池的预算。
# 查询数的是 order 收到的 gRPC 请求（受理和查询）。它不包含消费 Kafka 落库的那一半工作：
# 落库的量跟着受理走，但落库卡在下游时请求速率和 CPU 都不涨，那种情况要按消费延迟伸缩（KEDA 的 kafka 触发器），没有做。
# perReplica 的来历（2026-11-22 重定，记录 round-8-cpu-requests.md）：每个 Pod 的 CPU requests 是 950m（700 加边车 250），
# 70% 是 665m。每个 gRPC 请求的 CPU（服务加边车，含落库）：混合读写（查询和受理约 5 比 1）约 3.1 毫核·秒，
# 普通下单（约 2.4 比 1）约 4.2。按便宜的组合算 665m 对应 215 请求/秒，取 200；下单占比高时由 CPU 那一项先触发。
autoscaling:
  enabled: true
  maxReplicas: 2
  requestRate:
    query: sum(rate(rpc_server_call_duration_seconds_count{k8s_namespace_name="oppenheimer",service_name="order"}[1m]))
    perReplica: 200
