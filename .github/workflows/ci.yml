name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 找出仓库里所有 go module。还没有 Go 代码时列表为空，后面的任务自动跳过。
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.find.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          modules=$(find . -name go.mod -not -path './.git/*' -exec dirname {} \; | sort | jq -R . | jq -sc .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "发现的模块：$modules"

  lint:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: ${{ matrix.module }}

  test:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    # 集成测试依赖 MySQL、Redis、Kafka，用和本机相同的 compose 文件启动（make up），
    # 版本只在 deploy/compose 一处维护。每个测试自建临时库、随机 key 前缀和临时 topic。
    env:
      OPPENHEIMER_TEST_MYSQL_DSN: root:oppenheimer@tcp(127.0.0.1:3306)/
      OPPENHEIMER_TEST_REDIS_ADDR: 127.0.0.1:6379
      OPPENHEIMER_TEST_KAFKA_BROKERS: 127.0.0.1:9092
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Start dependencies
        # 按模块的测试只用 3306 上的 mysql、redis、kafka（每个测试自建临时库），
        # 不碰 order 的主从，所以用 up-core 少起 4 个 MySQL 容器；只有 e2e 需要主从。
        run: make up-core
      - name: Build
        working-directory: ${{ matrix.module }}
        # -o /dev/null：只检查能否编译，不在源码目录里留下二进制
        run: go build -o /dev/null ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        working-directory: ${{ matrix.module }}
        run: go tool cover -func=coverage.out | tail -n 1

  # 端到端测试：启动四个服务，通过网关验证主流程和并发场景下的一致性。
  e2e:
    needs: detect
    if: needs.detect.outputs.modules != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Start dependencies
        # e2e 要 order 的主从（读从库、主从延迟用例），必须用 make up。
        run: make up
      - name: Run end-to-end tests
        run: make e2e
      - name: Collect Envoy sidecar logs
        # 边车随 make up 启动（ADR-0020），服务间的调用失败时，熔断和超时的原因在它们的日志和统计里。
        if: failure()
        run: |
          mkdir -p tmp/e2e-logs
          for entry in gateway:19901 order:19902 payment:19903 inventory:19904 orderindex:19905; do
            s="${entry%%:*}"
            port="${entry##*:}"
            docker logs "oppenheimer-envoy-$s-1" >"tmp/e2e-logs/envoy-$s.log" 2>&1 || true
            curl -fsS -m 5 "127.0.0.1:$port/stats" >"tmp/e2e-logs/envoy-$s.stats" 2>&1 || true
          done
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: tmp/e2e-logs/

  # Envoy 边车配置的校验（deploy/envoy/，ADR-0020）：配置写错时在这里失败，不用等到 e2e 起不来。
  envoy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Envoy configs
        run: make envoy-validate

  # proto 的格式与规范检查，并确认入库的生成代码与 proto 定义一致。
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.75.0
      - name: Install protoc plugins
        run: make proto-plugins
      - name: Lint
        run: make proto-lint
      - name: Generate
        run: make proto
      - name: Check generated code is up to date
        run: |
          if [ -n "$(git status --porcelain -- api/gen)" ]; then
            git status --short -- api/gen
            git diff -- api/gen
            echo "::error::api/gen 与 proto 定义不一致，请运行 make proto 并提交"
            exit 1
          fi

  # 确认入库的生成代码与 OpenAPI 规范一致。
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - name: Install oapi-codegen
        run: make openapi-tools
      - name: Generate
        run: make openapi
      - name: Check generated code is up to date
        run: |
          if [ -n "$(git status --porcelain -- services/gateway/internal/httpapi/oas)" ]; then
            git status --short -- services/gateway/internal/httpapi/oas
            git diff -- services/gateway/internal/httpapi/oas
            echo "::error::生成代码与 api/openapi/gateway.yaml 不一致，请运行 make openapi 并提交"
            exit 1
          fi
